<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="icon-light-64.png">
<title>Cofrivo · Painel de acessos</title>
<style>
:root{--bg:#fbf7f5;--card:#fff;--line:#f0e6ea;--ink:#2b2530;--ink2:#6e6573;--ink3:#a39aa8;--accent:#c94f7c;--soft:#fde4ec;--mint:#d4f1e2;--pink:#fcdde8;--butter:#fff2c9;--lilac:#e8e0fb;--pos:#2c8560;--neg:#c8435a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font:700 22px ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;margin:8px 0;display:flex;align-items:center;gap:10px}
h1 img{width:36px;height:36px;border-radius:9px}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(120,70,100,.07)}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label{display:block;margin:8px 0}label span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:600}
button.sec{background:var(--soft);color:var(--accent)}button.ghost{background:none;color:var(--ink2);padding:6px 8px}
button.mini{padding:6px 10px;font-size:13px;font-weight:600}
.danger{background:#fde2e5;color:var(--neg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{border-radius:14px;padding:10px 12px}.stat b{display:block;font-size:22px}
.stat small{color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--bg);border:1px solid var(--line);color:var(--ink);font-weight:500;padding:6px 12px;border-radius:999px}
.chip.on{background:var(--pink);border-color:var(--accent)}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nome{font-weight:650}.m{font-size:12.5px;color:var(--ink2)}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:600}
.b-ativo,.b-teste{background:var(--mint);color:var(--pos)}.b-cortesia{background:var(--lilac);color:#5b46b0}
.b-vencido{background:var(--butter);color:#a86a00}.b-reembolsado,.b-cancelado,.b-bloqueado{background:#fde2e5;color:var(--neg)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
code{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:13px}
.msg{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px;font-size:13px}
.hint{font-size:12.5px;color:var(--ink3)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
#modal .mbox{width:100%;max-width:640px;margin:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:9}
</style>
</head>
<body><div class="wrap" id="app"></div><div id="toast"></div>
<script>
/* ===== Painel de acessos do Cofrivo =====
   Use o mesmo endereço e a mesma chave pública do app (ACESSO_CFG no index.html). */
const CFG = {url:'https://etcxpiwjmcjwwuyomceg.supabase.co', key:'sb_publishable_VQ-XW5YUXKc7jx_83GtK0g_k0Xm7QvV'};
const APP_LINK = location.href.replace(/admin\.html.*$/,'');
const S = {token:null, refresh:null, email:'', lista:[], filtro:'todos', busca:''};
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt = d => d ? new Date(d).toLocaleDateString('pt-BR') : '—';
const toast = m => { const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',2200); };
const addMes = (d,n=1) => { const x = new Date(d && new Date(d)>new Date() ? d : Date.now()); x.setMonth(x.getMonth()+n); return x.toISOString(); };
const addDias = n => new Date(Date.now()+n*864e5).toISOString();
function novoCodigo(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r=()=>Array.from(crypto.getRandomValues(new Uint8Array(4)),b=>A[b%A.length]).join(''); return `COF-${r()}-${r()}`; }
function estado(a){ if(['ativo','cortesia','teste'].includes(a.status) && a.valido_ate && new Date(a.valido_ate)<new Date()) return 'vencido'; return a.status; }

async function api(path, opt={}){
  const auth = S.token ? {'Authorization':'Bearer '+S.token} : CFG.key.startsWith('eyJ') ? {'Authorization':'Bearer '+CFG.key} : {};
  const r = await fetch(CFG.url+path, {...opt, headers:{'apikey':CFG.key,...auth,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401 && S.refresh){ if(await renovarSessao()) return api(path,opt); }
  if(!r.ok){ const t = await r.text(); throw new Error(t||r.status); }
  return r.status===204 ? null : r.json();
}
async function renovarSessao(){
  try{ const r = await fetch(CFG.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':CFG.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.refresh})});
    if(!r.ok) return false; const j = await r.json(); S.token=j.access_token; S.refresh=j.refresh_token; sessionStorage.setItem('cof.adm',JSON.stringify({t:S.token,r:S.refresh,e:S.email})); return true; }catch(e){ return false; }
}
async function entrar(){
  const email=$('#lgEmail').value.trim(), senha=$('#lgSenha').value;
  $('#lgMsg').textContent='Entrando…';
  const r = await fetch(CFG.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':CFG.key,'Content-Type':'application/json'},body:JSON.stringify({email,password:senha})});
  if(!r.ok){ $('#lgMsg').textContent='E-mail ou senha incorretos.'; return; }
  const j = await r.json(); S.token=j.access_token; S.refresh=j.refresh_token; S.email=email;
  sessionStorage.setItem('cof.adm',JSON.stringify({t:S.token,r:S.refresh,e:email}));
  carregar();
}
function sair(){ sessionStorage.removeItem('cof.adm'); S.token=null; telaLogin(); }

function telaConfig(){
  $('#app').innerHTML = `<h1><img src="icon-light-64.png" alt="">Painel do Cofrivo</h1>
    <div class="card"><h2>Falta conectar o servidor</h2><p>Preencha <code>CFG.url</code> e <code>CFG.key</code> no início deste arquivo com os dados do seu projeto Supabase (os mesmos do app).</p></div>`;
}
function telaLogin(){
  $('#app').innerHTML = `<h1><img src="icon-light-64.png" alt="">Painel do Cofrivo</h1>
    <div class="card" style="max-width:420px"><h2>Entrar</h2>
      <label><span>E-mail</span><input id="lgEmail" type="email" autocomplete="username"></label>
      <label><span>Senha</span><input id="lgSenha" type="password" autocomplete="current-password"></label>
      <button onclick="entrar()">Entrar</button><p class="hint" id="lgMsg"></p>
      <p class="m" style="margin-top:14px">Foi convidada(o) para administrar? <a href="#" onclick="telaCriarSenha();return false">Criar minha senha</a></p></div>`;
  $('#lgSenha').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});
}
function telaCriarSenha(){
  $('#app').innerHTML = `<h1><img src="icon-light-64.png" alt="">Painel do Cofrivo</h1>
    <div class="card" style="max-width:420px"><h2>Criar minha senha</h2>
      <p class="m">Use o e-mail que foi liberado como administrador.</p>
      <label><span>E-mail</span><input id="cdEmail" type="email" autocomplete="username"></label>
      <label><span>Senha (mínimo 8 caracteres)</span><input id="cdS1" type="password" autocomplete="new-password"></label>
      <label><span>Repita a senha</span><input id="cdS2" type="password" autocomplete="new-password"></label>
      <button onclick="criarSenha()">Criar senha</button><p class="hint" id="cdMsg"></p>
      <p class="m" style="margin-top:14px"><a href="#" onclick="telaLogin();return false">Voltar para entrar</a></p></div>`;
}
async function criarSenha(){
  const email=$('#cdEmail').value.trim().toLowerCase(), s1=$('#cdS1').value;
  if(!/^\S+@\S+\.\S+$/.test(email)) return $('#cdMsg').textContent='Digite um e-mail válido.';
  if(s1.length<8) return $('#cdMsg').textContent='A senha precisa ter pelo menos 8 caracteres.';
  if(s1!==$('#cdS2').value) return $('#cdMsg').textContent='As senhas não são iguais.';
  $('#cdMsg').textContent='Criando…';
  try{
    const r = await fetch(CFG.url+'/auth/v1/signup?redirect_to='+encodeURIComponent(PAINEL_LINK),{method:'POST',headers:{'apikey':CFG.key,'Content-Type':'application/json'},body:JSON.stringify({email,password:s1})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ const m = String(j.msg||j.message||j.error_description||'');
      return $('#cdMsg').textContent = /registered|already/i.test(m) ? 'Este e-mail já tem senha. Volte e entre normalmente.'
        : /disabled|not allowed/i.test(m) ? 'O cadastro está desligado no servidor. Peça para quem te convidou criar seu login no Supabase.' : 'Não consegui criar: '+m; }
    if(j.access_token){ S.token=j.access_token; S.refresh=j.refresh_token; S.email=email; sessionStorage.setItem('cof.adm',JSON.stringify({t:S.token,r:S.refresh,e:email})); return carregar(); }
    $('#app').innerHTML = `<h1><img src="icon-light-64.png" alt="">Painel do Cofrivo</h1><div class="card" style="max-width:420px"><h2>📧 Confirme seu e-mail</h2>
      <p>Enviamos um e-mail para <b>${esc(email)}</b>. Abra e toque no link de confirmação; depois volte aqui e entre com seu e-mail e senha.</p>
      <button onclick="telaLogin()">Ir para entrar</button></div>`;
  }catch(e){ $('#cdMsg').textContent='Sem conexão com o servidor.'; }
}
async function carregar(){
  try{
    S.admins = await api('/rest/v1/admins?select=*');
    if(!S.admins.length){ // logou, mas o e-mail não está na lista de administradores
      $('#app').innerHTML = `<h1><img src="icon-light-64.png" alt="">Painel do Cofrivo</h1><div class="card" style="max-width:420px"><h2>Sem permissão</h2>
        <p>O e-mail <b>${esc(S.email)}</b> ainda não foi liberado como administrador. Peça para quem cuida do painel liberar.</p><button onclick="sair()">Sair</button></div>`;
      return; }
    S.lista = await api('/rest/v1/acessos?select=*&order=criado_em.desc');
    S.nuvem = {}; try{ (await api('/rest/v1/dados_usuarios?select=codigo,atualizado_em')).forEach(n=>S.nuvem[n.codigo]=n.atualizado_em); }catch(e){} // tabela só existe depois do script 3
    tela(); }
  catch(e){ if(String(e.message).includes('JWT')) return sair(); $('#app').innerHTML = `<div class="card">Não consegui carregar. ${esc(e.message)}<br><button onclick="sair()">Entrar de novo</button></div>`; }
}
function tela(){
  const L = S.lista.map(a=>({...a, est:estado(a)}));
  const conta = f => L.filter(f).length;
  const em5 = a => ['ativo','teste'].includes(a.est) && a.valido_ate && new Date(a.valido_ate) - new Date() < 5*864e5;
  const filtros = {todos:()=>true, ativos:a=>['ativo','teste','cortesia'].includes(a.est), vencendo:em5, vencidos:a=>a.est==='vencido', encerrados:a=>['reembolsado','cancelado','bloqueado'].includes(a.est)};
  const b = S.busca.toLowerCase();
  const vis = L.filter(filtros[S.filtro]).filter(a=>!b || [a.nome,a.email,a.telefone,a.codigo,a.obs].join(' ').toLowerCase().includes(b));
  $('#app').innerHTML = `
  <div class="top"><h1><img src="icon-light-64.png" alt="">Painel do Cofrivo</h1><div><button class="mini sec" onclick="administradores()">👑 Administradores (${(S.admins||[]).length})</button> <button class="ghost" onclick="sair()">Sair (${esc(S.email)})</button></div></div>
  <div class="stats">
    <div class="stat" style="background:var(--mint)"><small>Assinaturas ativas</small><b>${conta(a=>a.est==='ativo')}</b></div>
    <div class="stat" style="background:var(--butter)"><small>Vencem em 5 dias</small><b>${conta(em5)}</b></div>
    <div class="stat" style="background:var(--pink)"><small>Vencidas</small><b>${conta(a=>a.est==='vencido')}</b></div>
    <div class="stat" style="background:var(--lilac)"><small>Cortesia / teste</small><b>${conta(a=>['cortesia','teste'].includes(a.est))}</b></div>
  </div>
  <div class="card"><h2>➕ Liberar acesso para alguém</h2>
    <div class="row">
      <label><span>Nome</span><input id="nNome"></label>
      <label><span>E-mail</span><input id="nEmail" type="email"></label>
      <label><span>WhatsApp</span><input id="nTel" inputmode="tel"></label>
    </div>
    <div class="row">
      <label><span>Tipo</span><select id="nPlano"><option value="mensal">Assinatura mensal</option><option value="anual">Assinatura anual</option><option value="teste">Teste grátis (7 dias)</option><option value="cortesia">Cortesia (sem vencimento)</option></select></label>
      <label><span>Aparelhos permitidos</span><input id="nMax" inputmode="numeric" value="2"></label>
      <label><span>Observação</span><input id="nObs" placeholder="Ex.: comprou pelo Instagram"></label>
    </div>
    <button onclick="criar()">Gerar código de acesso</button>
    <div id="nRes"></div>
  </div>
  <div class="card"><h2>👥 Acessos (${L.length})</h2>
    <input placeholder="Buscar por nome, e-mail, código…" value="${esc(S.busca)}" oninput="S.busca=this.value;tela();this.focus();this.setSelectionRange(this.value.length,this.value.length)">
    <div class="chips">${[['todos','Todos'],['ativos','Ativos'],['vencendo','Vencendo'],['vencidos','Vencidos'],['encerrados','Encerrados']].map(([k,l])=>`<button class="chip ${S.filtro===k?'on':''}" onclick="S.filtro='${k}';tela()">${l}</button>`).join('')}</div>
    ${vis.length?vis.map(item).join(''):'<p class="hint">Nada por aqui.</p>'}
  </div>
  <div class="card"><h2>ℹ️ Desistência em 7 dias (CDC, art. 49)</h2>
    <p class="m">Se a pessoa desistir da compra em até 7 dias, devolva o dinheiro e toque em <b>Reembolsar</b> no acesso dela. O app dela bloqueia na próxima vez que conferir o acesso (em até 24 horas com internet). Os dados financeiros ficam no celular dela e ela pode exportar um backup.</p></div>`;
}
function item(a){
  const devs = (a.dispositivos||[]).length;
  return `<div class="item">
    <div class="top"><div><span class="nome">${esc(a.nome||'(sem nome)')}</span> <span class="badge b-${a.est}">${{ativo:'ativo',teste:'teste',cortesia:'cortesia',vencido:'vencido',reembolsado:'reembolsado',cancelado:'cancelado',bloqueado:'bloqueado'}[a.est]}</span>
      <div class="m">${[a.email,a.telefone].filter(Boolean).map(esc).join(' · ')||'—'}</div></div>
      <div class="m" style="text-align:right">código <code>${esc(a.codigo)}</code><br>válido até <b>${a.valido_ate?dt(a.valido_ate):'sem vencimento'}</b></div></div>
    <div class="m">${devTxt(a)}${S.nuvem?.[a.codigo]?` · ☁️ nuvem ${dt(S.nuvem[a.codigo])}`:''} · último acesso ${a.ultimo_acesso?dt(a.ultimo_acesso):'nunca'} · criado em ${dt(a.criado_em)}${a.obs?' · '+esc(a.obs):''}</div>
    <div class="acts">
      ${a.plano!=='cortesia'?`<button class="mini sec" onclick="renovar('${a.codigo}')">${a.plano==='anual'?'+1 ano':'+1 mês'}</button>`:''}
      ${['reembolsado','cancelado','bloqueado'].includes(a.status)?`<button class="mini sec" onclick="mudar('${a.codigo}','ativo')">Reativar</button>`
        :`<button class="mini danger" onclick="mudar('${a.codigo}','reembolsado','Reembolso: remover o acesso de ${esc(a.nome||a.codigo)}?')">Reembolsar</button>
          <button class="mini danger" onclick="mudar('${a.codigo}','cancelado','Cancelar a assinatura de ${esc(a.nome||a.codigo)}?')">Cancelar</button>
          <button class="mini danger" onclick="mudar('${a.codigo}','bloqueado','Pausar o acesso de ${esc(a.nome||a.codigo)}?')">Pausar</button>`}
      <button class="mini sec" onclick="aparelhos('${a.codigo}')">📱 Aparelhos${devs?` (${devs})`:''}</button>
      <button class="mini sec" onclick="editar('${a.codigo}')">✏️ Editar</button>
      <button class="mini sec" onclick="copiarMsg('${a.codigo}')">Copiar mensagem</button>
      <button class="mini ghost" onclick="excluir('${a.codigo}')">Excluir</button>
    </div></div>`;
}
const msgCliente = a => `Oi${a.nome?', '+a.nome.split(' ')[0]:''}! 💗 Seu acesso ao Cofrivo está liberado.\n\n1) Abra: ${APP_LINK}\n   (no iPhone, abra pelo Safari e toque em Compartilhar → Adicionar à Tela de Início)\n2) Digite seu código: ${a.codigo}\n\nQualquer dúvida, é só me chamar.`;
async function criar(){
  const plano = $('#nPlano').value;
  const a = {codigo:novoCodigo(), nome:$('#nNome').value.trim()||null, email:$('#nEmail').value.trim()||null, telefone:$('#nTel').value.trim()||null,
    plano, status: plano==='cortesia'?'cortesia':plano==='teste'?'teste':'ativo',
    valido_ate: plano==='mensal'?addMes(null):plano==='anual'?addMes(null,12):plano==='teste'?addDias(7):null,
    max_dispositivos: Math.max(1,parseInt($('#nMax').value)||2), obs:$('#nObs').value.trim()||null};
  try{
    await api('/rest/v1/acessos',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(a)});
    S.lista.unshift({...a,dispositivos:[],criado_em:new Date().toISOString()});
    tela();
    $('#nRes').innerHTML = `<p>✅ Código criado: <code>${a.codigo}</code></p><div class="msg">${esc(msgCliente(a))}</div>
      <div class="acts"><button class="mini" onclick="copiarMsg('${a.codigo}')">Copiar mensagem</button>
      ${a.telefone?`<a href="https://wa.me/${zap(a.telefone)}?text=${encodeURIComponent(msgCliente(a))}" target="_blank"><button class="mini sec">Enviar no WhatsApp</button></a>`:''}</div>`;
  }catch(e){ alert('Não consegui criar: '+e.message); }
}
const zap = t => { let n=String(t).replace(/\D/g,''); if(n.length<=11) n='55'+n; return n; };
async function patch(codigo, dados){
  await api(`/rest/v1/acessos?codigo=eq.${encodeURIComponent(codigo)}`,{method:'PATCH',body:JSON.stringify({...dados,atualizado_em:new Date().toISOString()})});
  Object.assign(S.lista.find(x=>x.codigo===codigo), dados); tela();
}
async function renovar(c){ const a=S.lista.find(x=>x.codigo===c); const anual=a.plano==='anual'; await patch(c,{valido_ate:addMes(a.valido_ate, anual?12:1), status: a.status==='teste'?'ativo':a.status==='vencido'?'ativo':a.status, plano: anual?'anual':'mensal'}); toast('Renovado até '+dt(S.lista.find(x=>x.codigo===c).valido_ate)); }
function editar(c){
  const a = S.lista.find(x=>x.codigo===c); if(!a) return;
  const d = a.valido_ate ? new Date(a.valido_ate).toISOString().slice(0,10) : '';
  const opt = (v,l,cur) => `<option value="${v}" ${cur===v?'selected':''}>${l}</option>`;
  const m = document.createElement('div'); m.id='modal';
  m.innerHTML = `<div class="card mbox"><div class="top"><h2>✏️ Editar ${esc(a.nome||a.codigo)}</h2><button class="ghost" onclick="fecharModal()">Fechar</button></div>
    <p class="m">Código <code>${esc(a.codigo)}</code></p>
    <div class="row"><label><span>Nome</span><input id="eNome" value="${esc(a.nome||'')}"></label>
      <label><span>E-mail</span><input id="eEmail" type="email" value="${esc(a.email||'')}"></label>
      <label><span>WhatsApp</span><input id="eTel" value="${esc(a.telefone||'')}"></label></div>
    <div class="row"><label><span>Plano</span><select id="ePlano">${opt('mensal','Assinatura mensal',a.plano)}${opt('anual','Assinatura anual',a.plano)}${opt('teste','Teste grátis',a.plano)}${opt('cortesia','Cortesia',a.plano)}</select></label>
      <label><span>Situação</span><select id="eStatus">${opt('ativo','Ativo',a.status)}${opt('teste','Teste',a.status)}${opt('cortesia','Cortesia',a.status)}${opt('bloqueado','Pausado',a.status)}${opt('cancelado','Cancelado',a.status)}${opt('reembolsado','Reembolsado',a.status)}</select></label></div>
    <div class="row"><label><span>Válido até (vazio = sem vencimento)</span><input id="eVal" type="date" value="${d}"></label>
      <label><span>Aparelhos permitidos</span><input id="eMax" inputmode="numeric" value="${a.max_dispositivos}"></label></div>
    <label><span>Observação</span><input id="eObs" value="${esc(a.obs||'')}"></label>
    <div class="acts"><button onclick="salvarEdicao('${a.codigo}')">Salvar</button><button class="sec" onclick="fecharModal()">Cancelar</button></div></div>`;
  document.body.appendChild(m);
  $('#ePlano').onchange = e => { if(e.target.value==='cortesia'){ $('#eStatus').value='cortesia'; $('#eVal').value=''; } else if(e.target.value==='teste') $('#eStatus').value='teste'; else if(['cortesia','teste'].includes($('#eStatus').value)) $('#eStatus').value='ativo'; };
}
function fecharModal(){ $('#modal')?.remove(); }
async function salvarEdicao(c){
  const v = $('#eVal').value;
  const dados = {nome:$('#eNome').value.trim()||null, email:$('#eEmail').value.trim()||null, telefone:$('#eTel').value.trim()||null,
    plano:$('#ePlano').value, status:$('#eStatus').value, valido_ate: v ? new Date(v+'T23:59:59').toISOString() : null,
    max_dispositivos: Math.max(1, parseInt($('#eMax').value)||1), obs:$('#eObs').value.trim()||null};
  try{ await patch(c, dados); fecharModal(); toast('Alterações salvas'); }catch(e){ alert('Não consegui salvar: '+e.message); }
}
async function mudar(c,status,pergunta){ if(pergunta && !confirm(pergunta)) return; await patch(c,{status}); toast('Pronto: '+status); }
/* ---------- administradores: quem pode entrar e mexer no painel ---------- */
const PAINEL_LINK = location.href.split('?')[0].split('#')[0];
const msgAdmin = a => `Oi${a.nome?', '+a.nome.split(' ')[0]:''}! Liberei você como administrador(a) do painel do Cofrivo.\n\n1) Abra: ${PAINEL_LINK}\n2) Toque em "Criar minha senha" e use este e-mail: ${a.email}\n3) Confirme pelo link que chegar no seu e-mail e depois entre com seu e-mail e senha.`;
function administradores(){
  fecharModal();
  const eu = S.email.toLowerCase();
  const m = document.createElement('div'); m.id='modal';
  m.innerHTML = `<div class="card mbox"><div class="top"><h2>👑 Administradores</h2><button class="ghost" onclick="fecharModal()">Fechar</button></div>
    <p class="m">Quem está aqui entra no painel e pode fazer tudo: criar e editar códigos, reembolsar, liberar aparelhos, apagar dados da nuvem e liberar outros administradores.</p>
    ${(S.admins||[]).map(a=>`<div class="item" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <div><b>${esc(a.nome||a.email)}</b>${a.email.toLowerCase()===eu?' <span class="badge b-cortesia">você</span>':''}<div class="m">${esc(a.email)}${a.adicionado_por?` · liberado por ${esc(a.adicionado_por)}`:''}${a.adicionado_em?` em ${dt(a.adicionado_em)}`:''}</div></div>
      <div class="acts" style="margin:0">${a.email.toLowerCase()!==eu?`<button class="mini sec" onclick="copiarMsgAdmin('${esc(a.email)}')">Copiar convite</button>
        <button class="mini danger" onclick="removerAdmin('${esc(a.email)}')">Remover</button>`:''}</div></div>`).join('')}
    <h2 style="margin-top:16px">➕ Liberar novo administrador</h2>
    <div class="row"><label><span>Nome</span><input id="adNome"></label><label><span>E-mail</span><input id="adEmail" type="email"></label></div>
    <button onclick="addAdmin()">Liberar acesso ao painel</button>
    <div id="adRes"></div></div>`;
  document.body.appendChild(m);
}
async function addAdmin(){
  const email = $('#adEmail').value.trim().toLowerCase(), nome = $('#adNome').value.trim()||null;
  if(!/^\S+@\S+\.\S+$/.test(email)) return alert('Digite um e-mail válido.');
  if((S.admins||[]).some(a=>a.email.toLowerCase()===email)) return alert('Este e-mail já é administrador.');
  if(!confirm(`Liberar ${email} como administrador? Essa pessoa vai poder fazer tudo no painel.`)) return;
  try{
    const r = await api('/rest/v1/admins',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({email,nome,adicionado_por:S.email})});
    S.admins.push((r&&r[0])||{email,nome,adicionado_por:S.email,adicionado_em:new Date().toISOString()}); tela(); administradores();
    const a = S.admins.find(x=>x.email===email);
    $('#adRes').innerHTML = `<p>✅ Liberado. Mande o convite:</p><div class="msg">${esc(msgAdmin(a))}</div>
      <div class="acts"><button class="mini" onclick="copiarMsgAdmin('${esc(email)}')">Copiar convite</button></div>`;
  }catch(e){ alert(/row-level|policy|permission/i.test(e.message)?'O servidor ainda não permite isso. Rode o arquivo 4-administradores.sql no Supabase.':'Não consegui liberar: '+e.message); }
}
async function removerAdmin(email){
  if(!confirm(`Remover ${email} dos administradores? A pessoa perde o acesso ao painel na hora.`)) return;
  try{ await api(`/rest/v1/admins?email=eq.${encodeURIComponent(email)}`,{method:'DELETE',headers:{Prefer:'return=representation'}});
    S.admins = S.admins.filter(a=>a.email!==email); tela(); administradores(); toast('Administrador removido'); }
  catch(e){ const m = e.message.match(/"message":"([^"]+)"/); alert('Não consegui remover: '+(m?m[1]:e.message)); }
}
async function copiarMsgAdmin(email){ const a = S.admins.find(x=>x.email===email); try{ await navigator.clipboard.writeText(msgAdmin(a)); toast('Convite copiado'); }catch(e){ prompt('Copie o convite:', msgAdmin(a)); } }

/* ---------- aparelhos e nuvem de um código ---------- */
const SEM_LIMITE = 999, COLETIVO = 10000;
const devTxt = a => { const n = (a.dispositivos||[]).length;
  return a.max_dispositivos>=COLETIVO ? `${n} aparelho(s) · código coletivo` : a.max_dispositivos>=SEM_LIMITE ? `${n} aparelho(s) · sem limite` : `${n}/${a.max_dispositivos} aparelho(s)`; };
function aparelhos(c){
  const a = S.lista.find(x=>x.codigo===c); if(!a) return;
  const devs = a.dispositivos||[], nv = S.nuvem?.[c];
  fecharModal();
  const m = document.createElement('div'); m.id='modal';
  m.innerHTML = `<div class="card mbox"><div class="top"><h2>📱 Aparelhos de ${esc(a.nome||a.codigo)}</h2><button class="ghost" onclick="fecharModal()">Fechar</button></div>
    <p class="m">${devTxt(a)}. Cada celular, computador ou navegador diferente conta como um aparelho.</p>
    ${devs.length ? devs.map((d,i)=>`<div class="item" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span>Aparelho ${i+1} <span class="m">· ${esc(String(d).slice(0,8))}</span></span>
        <button class="mini danger" onclick="removerAparelho('${c}',${i})">Remover</button></div>`).join('')
      : '<p class="hint">Nenhum aparelho entrou com este código ainda.</p>'}
    <div class="acts">
      ${a.max_dispositivos<SEM_LIMITE?`<button class="mini" onclick="maisAparelho('${c}')">+1 aparelho</button>
      <button class="mini sec" onclick="limiteAparelhos('${c}',${SEM_LIMITE})">Sem limite</button>`
      : a.max_dispositivos<COLETIVO?`<button class="mini sec" onclick="limiteAparelhos('${c}',Math.max(2,${devs.length}))">Voltar a ter limite</button>`:''}
      ${devs.length?`<button class="mini sec" onclick="liberarAparelhos('${c}')">Liberar todos</button>`:''}
    </div>
    ${a.max_dispositivos<COLETIVO?`<h2 style="margin-top:18px">☁️ Dados na nuvem</h2>
      ${nv?`<p class="m">A pessoa guarda os dados na nuvem (última atualização ${new Date(nv).toLocaleString('pt-BR')}). Os dados são criptografados: ninguém consegue ler, nem você.</p>
        <p class="m">Se ela <b>esqueceu a senha</b>, apague os dados da nuvem; ela ativa de novo com uma senha nova, no aparelho que tem os dados.</p>
        <div class="acts"><button class="mini danger" onclick="apagarNuvem('${c}')">Apagar dados da nuvem</button></div>`
      : '<p class="m">Esta pessoa ainda não ativou a nuvem.</p>'}`:''}
  </div>`;
  document.body.appendChild(m);
}
async function salvarAparelhos(c, dados, msg){ try{ await patch(c, dados); aparelhos(c); toast(msg); }catch(e){ alert('Não consegui salvar: '+e.message); } }
function removerAparelho(c, i){ const a = S.lista.find(x=>x.codigo===c); if(!confirm(`Remover o aparelho ${i+1}? Ele vai pedir o código de novo e só entra se houver vaga.`)) return;
  salvarAparelhos(c, {dispositivos:(a.dispositivos||[]).filter((_,j)=>j!==i)}, 'Aparelho removido'); }
function maisAparelho(c){ const a = S.lista.find(x=>x.codigo===c); salvarAparelhos(c, {max_dispositivos:a.max_dispositivos+1}, `Agora: ${a.max_dispositivos+1} aparelhos`); }
function limiteAparelhos(c, n){ salvarAparelhos(c, {max_dispositivos:n}, n>=SEM_LIMITE?'Sem limite de aparelhos':`Limite: ${n} aparelhos`); }
function liberarAparelhos(c){ if(!confirm('Liberar todos os aparelhos deste código? Cada um vai pedir o código de novo ao conferir o acesso.')) return; salvarAparelhos(c, {dispositivos:[]}, 'Aparelhos liberados'); }
async function apagarNuvem(c){
  if(!confirm('Apagar os dados da nuvem deste código? Os dados que estão nos aparelhos da pessoa continuam lá. Não dá para desfazer.')) return;
  try{ await api(`/rest/v1/dados_usuarios?codigo=eq.${encodeURIComponent(c)}`,{method:'DELETE'}); delete S.nuvem[c]; tela(); aparelhos(c); toast('Dados da nuvem apagados'); }
  catch(e){ alert('Não consegui apagar: '+e.message); }
}
async function excluir(c){ if(!confirm('Excluir este acesso de vez? (Para reembolso, prefira “Reembolsar”, que guarda o histórico.)')) return;
  await api(`/rest/v1/acessos?codigo=eq.${encodeURIComponent(c)}`,{method:'DELETE'}); S.lista=S.lista.filter(x=>x.codigo!==c); tela(); }
async function copiarMsg(c){ const a=S.lista.find(x=>x.codigo===c); try{ await navigator.clipboard.writeText(msgCliente(a)); toast('Mensagem copiada'); }catch(e){ prompt('Copie a mensagem:', msgCliente(a)); } }

(function(){
  if(!CFG.url || !CFG.key) return telaConfig();
  // voltou do link de confirmação do e-mail: já entra direto
  const h = new URLSearchParams(location.hash.slice(1));
  if(h.get('access_token')){
    history.replaceState(null,'',location.pathname);
    try{ const p = JSON.parse(atob(h.get('access_token').split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      S.token=h.get('access_token'); S.refresh=h.get('refresh_token'); S.email=p.email||'';
      sessionStorage.setItem('cof.adm',JSON.stringify({t:S.token,r:S.refresh,e:S.email})); toast('E-mail confirmado ✅'); return carregar(); }catch(e){}
  }
  if(h.get('error')){ history.replaceState(null,'',location.pathname); telaLogin();
    $('#lgMsg').textContent = /expired|invalid/i.test(h.get('error_code')||h.get('error_description')||'') ? 'O link de confirmação expirou ou já foi usado. Tente entrar com seu e-mail e senha.' : 'Não deu certo pelo link. Tente entrar com seu e-mail e senha.'; return; }
  const s = JSON.parse(sessionStorage.getItem('cof.adm')||'null');
  if(s){ S.token=s.t; S.refresh=s.r; S.email=s.e; carregar(); } else telaLogin();
})();
</script>
</body>
</html>
