/* ---------- importação / backup ---------- */
// Aceita o formato do backup e um formato simplificado (para dados gerados pelo Claude):
// debts: {desc, creditor, value, total, firstMonth}  OU  {..., current, refMonth?}
// tx:    {type:"in"|"out", desc, value, date:"AAAA-MM-DD", cat}
// fixed: {type, desc, value, cat, start:"AAAA-MM", day?, end?}
function normalize(data){
  const out = blank(), errs = [];
  const num = v => r2(parseMoney(v));
  (data.debts||[]).forEach((d,i)=>{
    const value=num(d.value), total=parseInt(d.total);
    let first = d.firstMonth;
    if(!first && d.current) first = addM(d.refMonth||THIS_MONTH,-(parseInt(d.current)-1));
    if(!d.desc||!(value>0)||!(total>=1)||!/^\d{4}-\d{2}$/.test(first||'')) return errs.push(`dívida ${i+1} (${d.desc||'?'})`);
    out.debts.push({id:d.id||uid(),desc:d.desc,creditor:d.creditor||'Outros',kind:KINDS[d.kind]?d.kind:'cartao',value,total,day:parseInt(d.day)||null,firstMonth:first});
  });
  (data.tx||[]).forEach((t,i)=>{
    const value=num(t.value);
    if(!t.desc||!(value>0)||!/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')) return errs.push(`lançamento ${i+1} (${t.desc||'?'})`);
    out.tx.push({id:t.id||uid(),type:t.type==='in'?'in':'out',desc:t.desc,value,date:t.date,cat:t.cat||'Outros',ded:t.ded||'',nf:!!t.nf});
  });
  (data.fixed||[]).forEach((f,i)=>{
    const value=num(f.value);
    if(!f.desc||!(value>0)||!/^\d{4}-\d{2}$/.test(f.start||'')) return errs.push(`fixo ${i+1} (${f.desc||'?'})`);
    out.fixed.push({id:f.id||uid(),type:f.type==='in'?'in':'out',desc:f.desc,value,cat:f.cat||'Outros',start:f.start,day:f.day?+f.day:null,end:f.end||null,ded:f.ded||'',nf:!!f.nf});
  });
  if(data.irDates && typeof data.irDates==='object') out.irDates = data.irDates;
  if(data.balance && /^\d{4}-\d{2}-\d{2}$/.test(data.balance.date||'') && isFinite(+data.balance.value)) out.balance = {value:+data.balance.value,date:data.balance.date,...(data.balance.at?{at:data.balance.at}:{})};
  if(data.paid && typeof data.paid==='object') out.paid = data.paid;
  if(data.budget>0) out.budget = num(data.budget);
  if(data.rates && typeof data.rates==='object') out.rates = data.rates;
  if(data.imovel && parseMoney(data.imovel.parcelaRef)>0) out.imovel = {...IMOVEL_DEFAULT,...data.imovel};
  if(data.freio && typeof data.freio==='object') out.freio = data.freio;
  if(Array.isArray(data.metas)) out.metas = data.metas;
  if(Array.isArray(data.cartoes)) out.cartoes = data.cartoes;
  if(data.perfil && ['f','m','n'].includes(data.perfil.genero)) out.perfil = {genero:data.perfil.genero, ...(data.perfil.modo?{modo:data.perfil.modo}:{})};
  if(Array.isArray(data.ferias)) out.ferias = data.ferias.filter(f=>/^\d{4}-\d{2}-\d{2}$/.test(f.start||'')&&f.dias>0).map(f=>({id:f.id||uid(),start:f.start,dias:+f.dias,abono:+f.abono||0}));
  if(data.salary && parseMoney(data.salary.gross)>0){
    const s = data.salary;
    out.salary = {gross:num(s.gross), advPct:s.advPct!=null?Number(s.advPct):40, deps:parseInt(s.deps)||0,
      vtValue:num(s.vtValue||0), vr:num(s.vr||0), others:(s.others||[]).map(o=>({desc:o.desc,value:num(o.value)})),
      since:s.since||THIS_MONTH, decimo:s.decimo!==false, actual:s.actual||{}};
    ['tipo','diaA','diaB','irNoAdiant','folhaFecha','feriasSaldo','valorA','valorB'].forEach(k=>{ if(s[k]!==undefined) out.salary[k]=s[k]; });
    if(out.salary.diaA===undefined) migrate({salary:out.salary});
  }
  return {out,errs};
}
function merge(data,replace){
  const {out,errs} = normalize(data);
  const n = out.tx.length+out.fixed.length+out.debts.length+(out.salary?1:0)+(out.cartoes?.length||0)+(data.remover?1:0);
  if(out.salary) db.salary = out.salary;
  if(out.irDates) db.irDates = {...(db.irDates||{}),...out.irDates};
  if(out.balance) db.balance = out.balance;
  if(out.paid) db.paid = replace ? out.paid : {...(db.paid||{}), ...out.paid};
  if(out.budget) db.budget = out.budget;
  if(out.rates) db.rates = {...(db.rates||{}),...out.rates};
  if(out.imovel) db.imovel = out.imovel;
  if(out.ferias) db.ferias = out.ferias;
  if(out.freio) db.freio = out.freio;
  if(out.metas) db.metas = out.metas;
  if(out.cartoes){ db.cartoes = db.cartoes||[]; out.cartoes.forEach(c=>{ const i = db.cartoes.findIndex(x=>x.id===c.id); if(i>=0) db.cartoes[i] = c; else db.cartoes.push(c); }); }
  // atualizações do Claude podem pedir para tirar itens antigos (ex.: fatura que virou cartão)
  if(data.remover && !replace) ['debts','tx','fixed'].forEach(k=>{ const ids = data.remover[k]||[]; if(ids.length) db[k] = db[k].filter(x=>!ids.includes(x.id)); });
  if(out.perfil) db.perfil = out.perfil;
  if(!n) return alert('Nada válido para importar.'+(errs.length?'\nIgnorados: '+errs.join(', '):''));
  if(replace) db = out;
  else ['tx','fixed','debts'].forEach(k=>out[k].forEach(it=>{const i=db[k].findIndex(x=>x.id===it.id);i>=0?db[k][i]=it:db[k].push(it)}));
  save();
  alert(`Importados ${n} itens: ${out.salary?'salário, ':''}${out.cartoes?.length?out.cartoes.length+' cartões, ':''}${out.debts.length} dívidas, ${out.fixed.length} fixos, ${out.tx.length} lançamentos.`+(errs.length?'\n\nIgnorados (dados incompletos): '+errs.join(', '):''));
}
function parseJSON(text){
  text = text.trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  try{return JSON.parse(text)}catch(e){alert('Não consegui ler esses dados. Confira se colou o bloco inteiro.');return null}
}
function importPaste(){const d=parseJSON($('#paste').value);if(d){merge(d,false);$('#paste').value=''}}
function importFile(inp){
  const f=inp.files[0]; if(!f) return;
  f.text().then(t=>{const d=parseJSON(t); if(d && confirm('Substituir todos os dados atuais pelo backup?\n(Cancelar = juntar com os dados atuais)')) merge(d,true); else if(d) merge(d,false); inp.value=''});
}
async function exportData(){
  const json = JSON.stringify({app:'financas',version:1,exportedAt:new Date().toISOString(),...db},null,2);
  const name = `cofrivo-backup-${TODAY}.json`;
  const file = new File([json],name,{type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function copyData(){
  try{await navigator.clipboard.writeText(JSON.stringify(db));alert('Dados copiados. Cole na conversa com o Claude.')}
  catch(e){alert('Não foi possível copiar automaticamente. Use Exportar backup.')}
}

  'Salário':'💰','Freela/extra':'✨','Rendimentos':'📈','Reembolso':'↩️'};
const catIcon = c => CAT_ICONS[c] || '📦';
function gastosPorCategoria(M){
  const m = month(M), cats = {};
  const add = (c,v) => { if(v>0) cats[c] = r2((cats[c]||0)+v); };
  m.tx.filter(t=>t.type==='out').forEach(t=>add(t.cat,t.value));
  m.fixed.filter(t=>t.type==='out').forEach(t=>add(t.cat,t.value));
  if(m.imv) add('Imóvel financiado',m.imv.value);
  add('Cartões e parcelas', m.outInst);
  add('Consignados (folha)', m.outFolha);
  return Object.entries(cats).sort((a,b)=>b[1]-a[1]);
}
function gastosCard(M){
  const list = gastosPorCategoria(M), tot = list.reduce((t,[,v])=>t+v,0);
  if(!list.length) return '';
  const max = list[0][1];
  const sozinho = list.filter(([c])=>!['Cartões e parcelas','Consignados (folha)','Apartamento','Imóvel financiado','Moradia','Contas da casa'].includes(c));
  return `<div class="card"><h2>📊 Para onde vai seu dinheiro</h2>
    <p class="sub">Gastos de ${mLabel(M,{month:'long'})} por categoria · total ${brl(tot)}</p>
    ${list.map(([c,v])=>`<div class="catrow" title="${esc(c)}: ${brl(v)} (${Math.round(v/tot*100)}%)"><span>${catIcon(c)} ${esc(c)}</span><span class="v">${brl(v)} · <b>${Math.round(v/tot*100)}%</b></span>
      <div class="bar"><i style="width:${Math.max(2,v/max*100)}%"></i></div></div>`).join('')}
    ${!sozinho.length?`<p class="hint" style="margin-top:8px">Os gastos do dia a dia (mercado, iFood, Uber…) aparecem aqui quando você lança em <b>Lançar → Gastei com algo</b>.</p>`:''}
  </div>`;
}

function saveRealPay(){
  const s = db.salary; s.actual = s.actual||{};
  document.querySelectorAll('#sheet input[data-k]').forEach(inp=>{
    const M=inp.dataset.m, k=inp.dataset.k, v=inp.value.trim();

    if(!Object.keys(s.actual[M]).length) delete s.actual[M];
  });
  closeSheet(); save();

/* ---------- Contas: tudo que você paga ---------- */
/* ---------- cartões de crédito: fatura automática ----------
   Compra no cartão não sai da conta no dia: entra na fatura (pelo dia de fechamento) e sai no vencimento.
   Compra feita ANTES do dia de fechamento entra na fatura que fecha naquele mês; no dia do fechamento ou depois, vai para a próxima. */
const cartoes = () => db.cartoes || [];
function faturaDe(card, date){ // em que mês vence a fatura de uma compra feita em "date"
  const d = +date.slice(8), M = date.slice(0,7);
  const fechaM = d < card.fecha ? M : addM(M,1);
  return card.vence > card.fecha ? fechaM : addM(fechaM,1);
}
const faturaVence = (card,M) => `${M}-${pad(Math.min(card.vence, +lastDay(M).slice(8)))}`;
function faturaItens(card, M){
  const out = [];
  db.tx.filter(t=>t.cartao===card.id && t.type==='out').forEach(t=>{
    const n = Math.max(1, t.parcelas||1), m0 = faturaDe(card, t.date);
    const base = Math.floor(t.value/n*100)/100, resto = r2(t.value - base*n);
    for(let k=0;k<n;k++) if(addM(m0,k)===M) out.push({desc:t.desc, cat:t.cat, data:t.date, k:k+1, n, v:r2(base+(k===0?resto:0)), id:t.id});
  });
  db.fixed.filter(f=>f.cartao===card.id && f.type==='out').forEach(f=>{ // assinaturas no cartão
    for(const mm of [addM(M,-2), addM(M,-1), M]){
      if(!fixedActive(f,mm)) continue;
      const dt_ = `${mm}-${pad(Math.min(f.day||1, +lastDay(mm).slice(8)))}`;
      if(faturaDe(card, dt_)===M) out.push({desc:f.desc, cat:f.cat, data:dt_, fixo:true, v:f.value, id:f.id});
    }
  });
  return out.sort((a,b)=>a.data.localeCompare(b.data));
}
function faturaTotal(card, M){
  const itens = faturaItens(card, M), soma = r2(itens.reduce((s,i)=>s+i.v,0));

  return {itens, soma, real: real!=null, total: real!=null ? real : soma};
}

function saveCartao(id){

  db.cartoes = db.cartoes || [];

  Object.assign(c, {nome, fecha, vence, limite: r2(parseMoney($('#ccLim').value)||0) || null});

function delCartao(id){
  const usados = db.tx.filter(t=>t.cartao===id).length + db.fixed.filter(f=>f.cartao===id).length;
  if(!confirm(`Excluir este cartão?${usados?` As ${usados} compras dele passam a contar como débito/Pix.`:''}`)) return;
  db.tx.forEach(t=>{ if(t.cartao===id){ delete t.cartao; delete t.parcelas; } });
  db.fixed.forEach(f=>{ if(f.cartao===id) delete f.cartao; });
  db.cartoes = cartoes().filter(c=>c.id!==id); closeSheet(); save();
}

    ${q('r1','Eu precisava disso antes de ver o anúncio?',['Sim','Não','Não sei'])}
    <label class="f"><span>Onde vou guardar ou usar?</span><input id="r2" placeholder="Ex.: no armário, já tenho um parecido…"></label>
    ${q('r3','Como vou me sentir daqui a 1 semana?',['Feliz com a compra','Indiferente',gw('Arrependida','Arrependido','Com arrependimento'),'Não sei'])}

    <p class="hint" style="text-align:center;margin-top:10px">Qualquer escolha está tudo bem. O importante é que agora é uma decisão, não um impulso.</p>`);
}
function decidir(id,res){
  const f = FR(), d = f.desejos.find(x=>x.id===id); if(!d) return;
  const pick = k => document.querySelector(`#${k} .chip.on`)?.textContent||'';
  d.reflexao = {precisava:pick('r1'), onde:$('#r2')?.value||'', semana:pick('r3')};
  if(res==='adiar'){ d.liberaEm = new Date(Date.now()+f.cfg.horas*3600e3).toISOString(); d.adiamentos=(d.adiamentos||0)+1; save(); closeSheet(); return; }
  d.status = res; d.resolvido = new Date().toISOString(); save();
  if(res==='desisti'){
    const s = freioStats();
    openSheet(`<h3>💚 Que decisão bonita <button onclick="closeSheet()">Fechar</button></h3>
      <div class="garden-mini">${gardenSVG()}</div>
      <p class="sub" style="text-align:center">${d.preco?`<b>${brl(d.preco)}</b> viraram água para o seu jardim 💧`:'Seu jardim ganhou água 💧'}</p>
      <p class="sub" style="text-align:center">Você já tem <b>${s.vitorias} vitória${s.vitorias===1?'':'s'}</b>.</p>`);
  } else {
    openSheet(`<h3>🛍️ Compra consciente <button onclick="closeSheet()">Fechar</button></h3>
      <p class="sub">Você esperou, pensou e decidiu. Isso é cuidado com você. 💗</p>
      <label class="check"><input type="checkbox" id="cLanc" checked> Lançar ${d.preco?brl(d.preco):'o valor'} como gasto de hoje</label>
      <label class="f"><span>Categoria</span><select id="cCat">${CATS.out.map(c=>`<option value="${esc(c)}" ${c==='Compras'?'selected':''}>${catIcon(c)} ${c}</option>`).join('')}</select></label>
      <button class="btn" onclick="lancarCompra('${id}')">Pronto</button>`);
  }
}
function lancarCompra(id){
  const d = FR().desejos.find(x=>x.id===id);
  if(d && $('#cLanc').checked && d.preco>0) db.tx.push({id:uid(),type:'out',desc:d.item,value:d.preco,cat:$('#cCat').value,date:TODAY});

}

/* ---------- 2. Surfar a onda ---------- */
let surfRAF = null;
function openSurf(desejoId=''){
  cancelAnimationFrame(surfRAF);
  openSheet(`<h3>🌊 Surfar a onda <button onclick="stopSurf();closeSheet()">Fechar</button></h3>
    <p class="sub" style="color:var(--ink2);font-size:13px;margin-top:-4px">Uma vontade é como uma onda: sobe, chega ao pico e desce, mesmo que você não faça nada.</p>
    <label class="f"><span>Tamanho da vontade agora</span></label>${slider('sAntes',7)}
    <label class="f"><span>Duração</span></label>
    <div class="seg"><button class="on" data-m="3" onclick="segPick(this)">3 min</button><button data-m="4" onclick="segPick(this)">4 min</button><button data-m="5" onclick="segPick(this)">5 min</button></div>
    <button class="btn" onclick="startSurf('${desejoId}')">Começar</button>`);
}
function segPick(b){ [...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b)); }
function startSurf(desejoId){
  const antes = +$('#sAntes').value, mins = +document.querySelector('#sheet .seg .on').dataset.m, dur = mins*60e3, t0 = performance.now();
  openSheet(`<h3>🌊 Respire e observe <button onclick="stopSurf();closeSheet()">Fechar</button></h3>
    <div class="wave"><svg viewBox="0 0 300 170" preserveAspectRatio="none"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g0)"/></linearGradient></defs>
      <path id="wpath" fill="url(#wg)"/></svg></div>
    <p class="surfphrase" id="sFrase">${SURF_FRASES[0]}</p>
    <div class="prog"><i id="sProg" style="width:0%"></i></div>
    <p class="hint" style="text-align:center" id="sTempo"></p>
    <button class="btn sec" onclick="endSurf(${antes},'${desejoId}',${t0})">Terminar agora</button>`);
  let lastF = -1;
  const frame = now => {
    const el = $('#wpath'); if(!el) return;
    const t = Math.min(1,(now-t0)/dur), h = Math.pow(Math.sin(Math.PI*t),1.4), ph = now/600;
    let d = 'M0,170 ';
    for(let x=0;x<=300;x+=10){ const y = 150 - h*105 - 7*Math.sin(x/28+ph) - 3*Math.sin(x/11-ph*1.7); d += `L${x},${y.toFixed(1)} `; }
    el.setAttribute('d', d+'L300,170 Z');
    $('#sProg').style.width = (t*100)+'%';
    const left = Math.max(0,dur-(now-t0)); $('#sTempo').textContent = `${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`;
    const fi = Math.min(SURF_FRASES.length-1, Math.floor(t*SURF_FRASES.length));
    if(fi!==lastF){ lastF = fi; const p=$('#sFrase'); p.classList.remove('fade'); void p.offsetWidth; p.textContent = SURF_FRASES[fi]; p.classList.add('fade'); }
    if(t<1) surfRAF = requestAnimationFrame(frame); else endSurf(antes,desejoId,t0);
  };
  frame(performance.now());
}
function stopSurf(){ cancelAnimationFrame(surfRAF); surfRAF = null; }
function endSurf(antes,desejoId,t0){
  stopSurf();
  const dur = Math.round((performance.now()-t0)/1000);
  openSheet(`<h3>🌊 Você surfou a onda <button onclick="closeSheet()">Fechar</button></h3>
    <p class="sub">Antes, a vontade estava em <b>${antes}/10</b>. E agora?</p>
    ${slider('sDepois',Math.max(0,antes-3))}
    <button class="btn" onclick="saveSurf(${antes},'${desejoId}',${dur})">Salvar</button>`);
}
function saveSurf(antes,desejoId,dur){
  const f = FR(), depois = +$('#sDepois').value;
  f.ondas.push({id:uid(), at:new Date().toISOString(), antes, depois, dur, desejoId});
  save();
  const caiu = antes-depois;
  openSheet(`<h3>💚 Feito <button onclick="closeSheet()">Fechar</button></h3>
    <p class="sub" style="text-align:center;font-size:16px">${caiu>0?`A vontade caiu de <b>${antes}</b> para <b>${depois}</b>. Você deixou a onda passar. 🌊`:`A vontade ainda está aí, e tudo bem. Você observou sem agir, e isso já é uma vitória.`}</p>
    ${ondasChart()}`);
}
function ondasChart(){
  const o = FR().ondas; if(!o.length) return '';
  const avgA = o.reduce((t,x)=>t+x.antes,0)/o.length, avgD = o.reduce((t,x)=>t+x.depois,0)/o.length;
  const avgMin = Math.max(1,Math.round(o.reduce((t,x)=>t+x.dur,0)/o.length/60));
  const Y = v => 18 + (10-v)*11.5, X1 = 70, X2 = 250;
  const lines = o.slice(-20).map(x=>`<line x1="${X1}" y1="${Y(x.antes)}" x2="${X2}" y2="${Y(x.depois)}" stroke="var(--bar-dim)" stroke-width="2" stroke-linecap="round"/>`).join('');
  return `<div class="chartbox"><svg viewBox="0 0 320 150" role="img" aria-label="Vontade antes e depois de surfar a onda">
    <line x1="${X1}" y1="12" x2="${X1}" y2="138" stroke="var(--line)"/><line x1="${X2}" y1="12" x2="${X2}" y2="138" stroke="var(--line)"/>
    ${lines}
    <line x1="${X1}" y1="${Y(avgA)}" x2="${X2}" y2="${Y(avgD)}" stroke="var(--bar)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${X1}" cy="${Y(avgA)}" r="5" fill="var(--bar)" stroke="var(--card)" stroke-width="2"/><circle cx="${X2}" cy="${Y(avgD)}" r="5" fill="var(--bar)" stroke="var(--card)" stroke-width="2"/>
    <text class="vl" x="${X1-10}" y="${Y(avgA)+4}" text-anchor="end">${avgA.toFixed(1).replace('.',',')}</text>
    <text class="vl" x="${X2+10}" y="${Y(avgD)+4}">${avgD.toFixed(1).replace('.',',')}</text>
    <text x="${X1}" y="149" text-anchor="middle">antes</text><text x="${X2}" y="149" text-anchor="middle">depois</text></svg></div>
    <p class="sub" style="text-align:center">Suas vontades caem em média de <b>${Math.round(avgA)}</b> para <b>${Math.round(avgD)}</b> em ${avgMin} minuto${avgMin>1?'s':''}.<br><small>Linha rosa forte = média · linhas claras = cada vez (${o.length})</small></p>`;
}

/* ---------- 3. Mapa de gatilhos ---------- */
const DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function registrosGatilho(){
  const f = FR();
  return [...f.desejos.map(d=>({at:d.criado,emocoes:d.emocoes,loja:d.loja,int:d.intensidade})),
          ...f.impulsos.map(d=>({at:d.at,emocoes:d.emocoes||[],loja:d.loja||'',int:null}))];
}
function barras(list,fmt=v=>v){
  const max = Math.max(1,...list.map(x=>x[1]));
  return list.map(([l,v])=>`<div class="catrow"><span>${l}</span><span class="v">${fmt(v)}</span><div class="bar"><i style="width:${Math.max(3,v/max*100)}%"></i></div></div>`).join('');
}
function gatilhosView(){
  const R = registrosGatilho();
  if(!R.length) return `<div class="card"><div class="empty">Ainda não há registros. Cada vez que você usar o “Tô com vontade”, o mapa vai se formando. 🗺️</div></div>`;
  const cnt = (arr) => arr.reduce((m,k)=>(m[k]=(m[k]||0)+1,m),{});
  const emo = Object.entries(cnt(R.flatMap(r=>r.emocoes))).sort((a,b)=>b[1]-a[1]);
  const faixa = h => Math.floor(h/2)*2;
  const fx = Object.entries(cnt(R.map(r=>faixa(new Date(r.at).getHours())))).sort((a,b)=>+a[0]-+b[0]);
  const fLabel = h => `${h}h–${(+h+2)%24}h`;
  const dias = Object.entries(cnt(R.map(r=>new Date(r.at).getDay()))).sort((a,b)=>+a[0]-+b[0]);
  const lojas = Object.entries(cnt(R.map(r=>r.loja).filter(Boolean))).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // frases
  const ins = [];
  if(R.length>=3){
    const topF = [...fx].sort((a,b)=>b[1]-a[1])[0];
    const emoF = Object.entries(cnt(R.filter(r=>faixa(new Date(r.at).getHours())==topF[0]).flatMap(r=>r.emocoes))).sort((a,b)=>b[1]-a[1])[0];
    ins.push(`Você sente mais vontade entre <b>${fLabel(topF[0])}</b>${emoF?`, geralmente <b>${emoLabel(emoF[0])}</b>`:''}.`);
    const topD = [...dias].sort((a,b)=>b[1]-a[1])[0]; ins.push(`O dia em que a vontade mais aparece é <b>${DIAS[topD[0]]}</b>.`);
    if(lojas[0]) ins.push(`<b>${esc(lojas[0][0])}</b> aparece em ${lojas[0][1]} dos seus ${R.length} registros.`);
    const byEmo = {}; R.filter(r=>r.int!=null).forEach(r=>r.emocoes.forEach(e=>{(byEmo[e]=byEmo[e]||[]).push(r.int)}));
    const forte = Object.entries(byEmo).filter(([,v])=>v.length>=2).map(([k,v])=>[k,v.reduce((a,b)=>a+b,0)/v.length]).sort((a,b)=>b[1]-a[1])[0];
    if(forte) ins.push(`Quando você está <b>${emoLabel(forte[0])}</b>, a vontade chega mais forte (média ${forte[1].toFixed(0)}/10).`);
    const s = freioStats(), resolvidos = FR().desejos.filter(d=>d.status!=='cofre').length;
    if(resolvidos) ins.push(`Dos ${resolvidos} itens que passaram pelo Cofre, você desistiu de <b>${s.desist}</b>. 💚`);
  }
  return `
  ${ins.length?`<div class="card"><h2>💡 O que seus registros mostram</h2><ul class="tips">${ins.map(i=>`<li>${i}</li>`).join('')}</ul></div>`
    :`<div class="card"><p class="sub">Com 3 registros ou mais, aparecem frases sobre seus padrões. Você tem ${R.length}.</p></div>`}
  <div class="card"><h2>Emoções</h2>${barras(emo.map(([k,v])=>[`${emoIcon(k)} ${emoLabel(k)}`,v]),v=>v+'×')}</div>
  <div class="card"><h2>Horários</h2>${barras(fx.map(([h,v])=>[fLabel(h),v]),v=>v+'×')}</div>
  <div class="card"><h2>Dias da semana</h2>${barras(dias.map(([d,v])=>[DIAS[d],v]),v=>v+'×')}</div>
  ${lojas.length?`<div class="card"><h2>Lojas e apps</h2>${barras(lojas.map(([l,v])=>[esc(l),v]),v=>v+'×')}</div>`:''}
  ${FR().ondas.length?`<div class="card"><h2>🌊 Surfar a onda</h2>${ondasChart()}</div>`:''}`;
}

/* ---------- 6. Jardim do eu do futuro ---------- */
function gardenStage(){
  const f = FR(), s = freioStats(), meta = f.meta;
  const pct = meta?.valor>0 ? s.agua/meta.valor : null;
  if(pct!=null) return pct>=1?5:pct>=.6?4:pct>=.35?3:pct>=.15?2:pct>0?1:0;
  return s.agua>=3000?5:s.agua>=1500?4:s.agua>=700?3:s.agua>=300?2:s.agua>0?1:0;
}
function gardenSVG(){
  const st_ = gardenStage(), lv = freioStats().nivel;
  const leaf = (x,y,r,flip) => `<ellipse cx="${x}" cy="${y}" rx="14" ry="7" fill="#8fd3b0" transform="rotate(${flip?30:-30} ${x} ${y})"/>`;
  const flower = (x,y,c='#f39bbb') => `<g>${[0,72,144,216,288].map(a=>`<circle cx="${x+7*Math.cos(a*Math.PI/180)}" cy="${y+7*Math.sin(a*Math.PI/180)}" r="5.5" fill="${c}"/>`).join('')}<circle cx="${x}" cy="${y}" r="4" fill="#ffd77a"/></g>`;
  const stemH = [0,30,60,85,100,110][st_];
  let plant = '';
  if(st_===0) plant = `<ellipse cx="160" cy="150" rx="6" ry="4" fill="#c79a73"/>`;
  else {
    plant += `<path d="M160 152 C 158 ${152-stemH/2}, 163 ${152-stemH/1.5}, 160 ${152-stemH}" stroke="#6cbf95" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    const leaves = [[150,140,0],[171,132,1],[148,118,0],[172,105,1],[149,95,0],[171,82,1]].slice(0,[0,2,4,5,6,6][st_]);
    plant += leaves.map(([x,y,fl])=>leaf(x,y,0,fl)).join('');
    if(st_>=3) plant += flower(160,152-stemH-4);
    if(st_>=4) plant += flower(138,90,'#c9b6f2')+flower(182,78,'#ffb38a');
    if(st_>=5) plant += flower(130,118,'#f7cddc')+flower(190,110,'#f39bbb');
  }
  const deco = NIVEIS.filter(([n])=>lv>=n).map(([n,e])=>({2:`<text x="40" y="50" font-size="22">🦋</text>`,3:`<circle cx="275" cy="38" r="16" fill="#ffe08a"/>`,4:`<text x="250" y="100" font-size="20">🐦</text>`,
    5:`<path d="M20 150 A 140 120 0 0 1 300 150" stroke="#f7cddc" stroke-width="6" fill="none" opacity=".7"/><path d="M32 150 A 128 108 0 0 1 288 150" stroke="#cfe9dc" stroke-width="6" fill="none" opacity=".7"/>`,
    6:`<text x="60" y="168" font-size="16">🌼</text><text x="235" y="168" font-size="16">🌷</text>`,7:`<text x="100" y="40" font-size="14">✨</text><text x="210" y="60" font-size="14">✨</text>`}[n])).join('');
  return `<svg viewBox="0 0 320 180" class="garden" role="img" aria-label="Seu jardim, estágio ${st_} de 5">
    <rect x="0" y="0" width="320" height="180" rx="18" fill="#f3faf6"/>${deco}
    <ellipse cx="160" cy="158" rx="120" ry="14" fill="#e9dccd"/>
    <path d="M128 150 L192 150 L184 176 L136 176 Z" fill="#f2b8a2"/><rect x="124" y="144" width="72" height="10" rx="4" fill="#eaa48b"/>
    ${plant}</svg>`;
}
function jardimView(){
  const f = FR(), s = freioStats(), meta = f.meta, pct = meta?.valor>0 ? Math.min(1,s.agua/meta.valor) : 0;
  const prox = NIVEIS.find(([n])=>n>s.nivel);
  return `<div class="card"><h2>🌱 Jardim do eu do futuro</h2>
    ${meta?`<div class="metahead">${meta.img?`<img src="${meta.img}" alt="">`:''}<div><b>${esc(meta.nome)}</b><small>${brl(s.agua)} de ${brl(meta.valor)} · ${Math.round(pct*100)}%</small></div></div>
      <div class="prog" style="height:10px;margin:8px 0 12px"><i style="width:${pct*100}%"></i></div>`
      :`<p class="sub">Escolha uma meta (viagem, reserva…). Cada desistência vira água para a planta e soma na meta.</p>`}
    ${gardenSVG()}
    <p class="sub" style="text-align:center;margin-top:8px">💧 ${brl(s.agua)} em água · nível ${s.nivel}${prox?` · no nível ${prox[0]} chega ${prox[1]} ${prox[2]}`:''}</p>
    <button class="btn sec" onclick="openMeta()">${meta?'Editar meta':'🎯 Definir minha meta'}</button>
    <p class="hint">A água vem do valor dos itens em que você desistiu. É dinheiro que ficou com você. Para guardar de verdade, transfira para sua reserva quando puder.</p></div>`;
}
function openMeta(){
  const m = FR().meta || {nome:'',valor:'',img:''};

/* ---------- holerite em PDF: ler, conferir e aplicar ----------
   O PDF é lido aqui no aparelho com a biblioteca pdf.js (baixada uma vez). Nada é enviado para servidor nenhum. */
const PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
let pdfjsLib = null;
async function loadPdfJs(){
  if(pdfjsLib) return pdfjsLib;
  pdfjsLib = await import(PDFJS_URL);
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_URL.replace('pdf.min.mjs','pdf.worker.min.mjs');
  return pdfjsLib;
}
async function pdfLines(buf){
  const lib = await loadPdfJs(), doc = await lib.getDocument({data:buf}).promise, out = [];
  for(let p=1; p<=doc.numPages; p++){
    const page = await doc.getPage(p), tc = await page.getTextContent(), rows = [];
    tc.items.forEach(it=>{
      const s = (it.str||'').trim(); if(!s) return;
      const x = it.transform[4], y = it.transform[5], w = it.width||0;
      let r = rows.find(r=>Math.abs(r.y-y)<2.5); if(!r){ r={y,items:[]}; rows.push(r); }
      r.items.push({s,x,end:x+w});
    });
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{ r.items.sort((a,b)=>a.x-b.x); r.text = r.items.map(i=>i.s).join(' '); out.push(r); });
  }
  return out;
}
const MONEY = /^-?\d{1,3}(\.\d{3})*,\d{2}$/;
const pm = s => parseMoney(s);
const MESES_N = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function parseHolerite(lines){
  const all = lines.map(l=>l.text).join('\n'), r = {rubricas:[], consignados:[], outros:[], extras:[]};
  // valor abaixo (ou ao lado) de um rótulo: primeiro valor à direita do início do rótulo
  const below = re => {
    const i = lines.findIndex(l=>re.test(l.text)); if(i<0) return null;
    const lab = lines[i].items.find(it=>re.test(it.s)) || lines[i].items.find(it=>re.test(it.s+' '));
    const lx = lab ? lab.x-4 : 0;
    const same = lines[i].items.filter(it=>MONEY.test(it.s) && it.x>=lx);
    if(same.length) return pm(same[0].s);
    for(const l of lines.slice(i+1,i+3)){
      const ms = l.items.filter(it=>MONEY.test(it.s));
      const right = ms.filter(it=>it.end>=lx+10);
      if(right.length) return pm(right[0].s);
    }
    return null;
  };
  const dateBelow = re => {
    const i = lines.findIndex(l=>re.test(l.text)); if(i<0) return null;
    for(const l of lines.slice(i,i+3)){ const m = l.text.match(/(\d{2})\/(\d{2})\/(\d{4})/); if(m) return `${m[3]}-${m[2]}-${m[1]}`; }
    return null;
  };
  r.dataPag = dateBelow(/Data\s*(de\s*)?Pag/i);
  const cm = all.match(/(janeiro|fevereiro|mar[cç]o|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\s*\/\s*(\d{4})/i);
  if(cm){ const mi = MESES_N.indexOf(cm[1].toLowerCase().replace('marco','março')); r.competencia = `${cm[2]}-${pad(mi+1)}`; }
  r.liquido = below(/L[íi]quido\s*a\s*Receber|L[íi]quido\s*a\s*Pagar|Valor\s*L[íi]quido/i);
  if(r.liquido==null){ const m = all.match(/L[íi]quido[^\d]{0,40}([\d.]+,\d{2})/i); if(m) r.liquido = pm(m[1]); }
  r.salCalculo = below(/Sal\.?\s*do\s*C[áa]lculo|Sal[áa]rio\s*Contratual/i);
  // colunas Referência / Provento / Desconto
  const hdr = lines.find(l=>/Provento|Vencimento/i.test(l.text) && /Desconto/i.test(l.text));
  const col = k => hdr?.items.find(it=>k.test(it.s));
  const cR = col(/Refer/i), cP = col(/Provento|Vencimento/i), cD = col(/Desconto/i);
  lines.forEach(l=>{
    const first = l.items[0]; if(!first || !/^\d{2,4}$/.test(first.s)) return;
    const money = l.items.filter(it=>MONEY.test(it.s));
    const desc = l.items.filter(it=>!MONEY.test(it.s) && it!==first).map(it=>it.s).join(' ').trim();
    if(!desc || !money.length) return;
    let prov = 0, dsc = 0;
    money.forEach(it=>{
      const cands = [['r',cR],['p',cP],['d',cD]].filter(c=>c[1]);
      if(!cands.length){ dsc = pm(it.s); return; }
      const best = cands.sort((a,b)=>Math.abs(a[1].end-it.end)-Math.abs(b[1].end-it.end))[0][0];
      if(best==='p') prov = pm(it.s); else if(best==='d') dsc = pm(it.s);
    });
    if(!prov && !dsc) return;
    r.rubricas.push({cod:first.s, desc, prov, dsc});
  });
  // classificação
  r.rubricas.forEach(x=>{
    const d = x.desc.toUpperCase();
    if(/SAL[AÁ]RIO\s*(BASE|MENSAL)|^SAL[AÁ]RIO$|HORAS\s*NORMAIS/.test(d) && x.prov){ r.bruto = x.prov; return; }
    if(/13/.test(d) && /SAL|ADIANT|PARC|GRATIF/.test(d)){ if(x.prov) r.decimo = (r.decimo||0)+x.prov; if(x.dsc) r.descontos13 = (r.descontos13||0)+x.dsc; return; }
    if(/ADIANT/.test(d)){ if(x.prov) r.adiantProv = x.prov; if(x.dsc) r.adiantDesc = x.dsc; return; }
    if(/I\.?\s*N\.?\s*S\.?\s*S|PREVID/.test(d) && x.dsc){ r.inss = (r.inss||0)+x.dsc; return; }
    if((/^I\.?\s*R\.?$|IRRF|IMPOSTO\s*DE\s*RENDA|^I\.R\./.test(d)) && x.dsc){ r.ir = (r.ir||0)+x.dsc; return; }
    if(/VTRANSP\s*MES|VLR\s*PG\s*VTRANSP|PG\s*VALE\s*TRANSP/.test(d)){ if(x.prov) r.vtBeneficio = x.prov; return; }
    if(/VALE\s*TRANSP|^V\.?T\.?\b|DESC\.?\s*VT/.test(d) && x.dsc){ r.vt = x.dsc; return; }
    if(/\bVR\b|\bVA\b|REFEI|ALIMENT/.test(d) && x.dsc){ r.vr = (r.vr||0)+x.dsc; return; }
    if(/CONSIG|EMPR[EÉ]ST|CR[EÉ]DITO\s*TRABALHADOR/.test(d) && x.dsc){ r.consignados.push({desc:x.desc, value:x.dsc}); return; }
    if(/F[EÉ]RIAS/.test(d)){ if(x.prov) r.ferias = (r.ferias||0)+x.prov; return; }
    if(x.dsc) r.outros.push({desc:x.desc, value:x.dsc});
    else if(x.prov) r.extras.push({desc:x.desc, value:x.prov});
  });
  r.tipo = r.bruto ? 'salario' : r.decimo ? '13' : r.adiantProv ? 'adiantamento' : r.ferias ? 'ferias' : 'outro';
  r.irNoAdiant = r.tipo==='adiantamento' && r.ir>0;
  return r;
}
async function lerHolerites(files){
  const res = [];
  for(const f of files){
    try{
      const buf = f.buf || await f.arrayBuffer();
      const lines = await pdfLines(buf);
      if(lines.length<3){ res.push({nome:f.name, erro:'Este PDF parece ser uma imagem (escaneado). Não consigo ler o texto dele.'}); continue; }
      res.push({nome:f.name, ...parseHolerite(lines)});
    }catch(e){ res.push({nome:f.name, erro: /import|fetch|network|Failed/i.test(e.message) ? 'Não consegui baixar o leitor de PDF. Verifique a internet e tente de novo.' : 'Não consegui ler este arquivo.'}); }
  }
  return res;
}

let HOL = [];
async function processarHolerites(files){
  if(!files || !files.length) return;
  $('#hStatus').textContent = 'Lendo… isso leva alguns segundos.';
  HOL = await lerHolerites([...files]);
  revisarHolerites();
}
function revisarHolerites(){
  const ok = HOL.filter(h=>!h.erro), sal = ok.filter(h=>h.tipo==='salario').sort((a,b)=>(b.dataPag||'').localeCompare(a.dataPag||''))[0];
  const adi = ok.filter(h=>h.tipo==='adiantamento').sort((a,b)=>(b.dataPag||'').localeCompare(a.dataPag||''))[0];
  const s = db.salary || {};
  const bruto = sal?.bruto || sal?.salCalculo || adi?.salCalculo || s.gross || '';
  const advVal = adi?.adiantProv || sal?.adiantDesc || 0;
  const advPct = bruto && advVal ? Math.round(advVal/bruto*100) : (s.advPct||0);
  // se o pagamento foi antecipado por fim de semana/feriado, volta para o dia "redondo" (ex.: 19/11 → dia 20)
  const guessDay = dt => { const d=+dt.slice(8), M=dt.slice(0,7); for(const N of [5,10,15,20,25,30,1]) if(N-d>=0 && N-d<=3 && payDate(M,N)===dt) return N; return d; };
  const diaA = sal?.dataPag ? guessDay(sal.dataPag) : (s.diaA||5);
  const diaB = adi?.dataPag ? guessDay(adi.dataPag) : (advVal ? (s.diaB||20) : null);
  const vtBen = sal?.vtBeneficio || (sal?.vt ? r2(sal.vt/0.06) : (s.vtValue||0));
  const jaTem = v => db.debts.some(d=>d.kind==='consignado' && Math.abs(d.value-v)<0.02);
  const consigNovos = (sal?.consignados||[]).filter(c=>!jaTem(c.value));
  const br = v => v===''||v==null ? '' : String(v).replace('.',',');
  const card = h => h.erro ? `<div class="need"><div class="line"><span>⚠️ ${esc(h.nome)}</span></div><div class="parts">${h.erro}</div></div>`
    : `<div class="need"><div class="line"><span><b>${{salario:'Salário',adiantamento:'Adiantamento','13':'13º salário',ferias:'Férias',outro:'Holerite'}[h.tipo]}</b>${h.competencia?' · '+mLabel(h.competencia,{month:'long',year:'numeric'}):''}</span><b class="pos">${h.liquido!=null?brl(h.liquido):''}</b></div>

/* ---------- resumo do mês: entradas x contas, separados ---------- */
let MF_MEMO = null; // cache usado pelo planejamento (muitos meses seguidos)
function monthFlow(M, depth=0){
  if(MF_MEMO && MF_MEMO[M]) return MF_MEMO[M];
  const b = db.balance, paid = db.paid||{}, bAt = b ? (b.at||b.date+'T00:00:00') : '', bm = b?.date.slice(0,7);
  // "done" = já aconteceu: antes do saldo informado, ou (sem saldo) antes de hoje
  const ev = events(M).map(e=>({...e, paid:!!paid[e.key], done: b ? (e.date<=b.date || (!!paid[e.key] && paid[e.key]<bAt)) : e.date<TODAY}));
  const byDate = (x,y) => x.date.localeCompare(y.date);
  const ins = ev.filter(e=>e.v>0).sort(byDate), outs = ev.filter(e=>e.v<0).sort(byDate);
  const inTot = r2(ins.reduce((t,e)=>t+e.v,0)), outTot = r2(outs.reduce((t,e)=>t-e.v,0));
  const dim = +lastDay(M).slice(8);
  const bud = db.budget>0 ? ceil2(M===bm ? db.budget*(dim-+b.date.slice(8))/dim : db.budget) : 0;
  let start = null, end = null;
  if(b && M>=bm && depth<60){
    if(M===bm){ start = b.value; end = r2(start + ev.filter(e=>!e.done).reduce((t,e)=>t+e.v,0) - bud); }
    else { start = monthFlow(addM(M,-1), depth+1).end; end = r2(start + inTot - outTot - bud); }
  }
  const aPagar = r2(outs.filter(e=>!e.paid && !e.done).reduce((t,e)=>t-e.v,0));
  const pago = r2(outTot - aPagar);
  const res = {M, ins, outs, inTot, outTot, bud, start, end, aPagar, pago, isBalMonth: b && M===bm};
  if(MF_MEMO) MF_MEMO[M] = res;
  return res;
}
function resumoMes(M){
  const f = monthFlow(M), nome = mLabel(M,{month:'long'}), dif = r2(f.inTot - f.outTot - f.bud);

  const inFut = r2(f.ins.filter(e=>!e.done).reduce((t,e)=>t+e.v,0)), inJa = r2(f.inTot - inFut);
  const pagoDepois = r2(f.outs.filter(e=>e.paid && !e.done).reduce((t,e)=>t-e.v,0));
  const outFut = r2(f.aPagar + f.bud), outJa = r2(f.outTot - f.aPagar - pagoDepois);

        ${L('➕ Ainda vai entrar', '+ '+brl(inFut), 'pos')}
        ${L('➖ Ainda falta pagar', '− '+brl(outFut))}
        ${pagoDepois?L('➖ Já pago depois do saldo informado', '− '+brl(pagoDepois)):''}

        ${f.isBalMonth?`<div class="parts">Está errado? <a href="#" onclick="openBalance();return false">Atualize quanto tem na conta hoje</a>.</div>`:'<div class="parts">Inclui o que sobrou ou faltou nos meses anteriores.</div>'}</div>`
    : `<div class="need" style="margin-top:10px">

        <div class="line big2"><span>= ${fimSemSaldo<0?'Vai faltar':'Vai sobrar'}</span><b class="${fimSemSaldo<0?'neg':'pos'}">${brl(Math.abs(fimSemSaldo))}</b></div>
        <div class="parts">Sem contar o que você tem na conta agora.</div></div>
      <button class="btn sec" onclick="openBalance()">👛 Informar quanto tenho na conta hoje</button>`;
  return `

      <div class="t-pink"><small>💳 ${passado?'Saiu':temPassado?'Ainda falta pagar':'Contas do mês'}</small><b>${brl(passado?f.outTot:outFut)}</b></div>
    </div>
    ${temPassado&&!passado?`<p class="sub" style="margin:8px 0 0">Já aconteceu em ${nome}: recebido ${brl(inJa)} · pago ${brl(outJa)}. Isso não entra na conta acima, porque já saiu ou entrou da sua conta.</p>`:''}
    ${conta}${aviso}
  </div>
  <div class="card"><div class="grouphead"><h2>💰 Entradas de ${nome}</h2>${passado?`<span class="pos">${brl(f.inTot)}</span>`:inFut>0?`<span class="pos">a receber ${brl(inFut)}</span>`:f.inTot?`<span class="pos">✓ tudo recebido</span>`:''}</div>
    ${f.inTot&&!passado?`<p class="sub">Total do mês: ${brl(f.inTot)}${inJa?` · já recebido ${brl(inJa)}`:''}</p>`:''}
    ${f.ins.length?`<ul class="list">${f.ins.map(linha).join('')}</ul>`:'<div class="empty">Nenhuma entrada prevista.</div>'}
  </div>
  <div class="card"><div class="grouphead"><h2>💳 Contas de ${nome}</h2>${passado?`<span>${brl(f.outTot)}</span>`:(f.aPagar+f.bud)>0?`<span class="neg">falta ${brl(f.aPagar+f.bud)}</span>`:f.outTot?`<span class="pos">✓ tudo pago</span>`:''}</div>
    ${f.outTot||f.bud?`<p class="sub">Total do mês: ${brl(f.outTot + f.bud)}${f.pago?` · <span class="pos">já pago ${brl(f.pago)}</span>`:''}${!passado&&(f.aPagar+f.bud)>0?' · toque na bolinha quando pagar':''}</p>`:''}
    ${f.outs.length?`<ul class="list">${f.outs.map(linha).join('')}</ul>`:'<div class="empty">Nenhuma conta neste mês.</div>'}
    ${f.bud?`<div class="hint" style="margin-top:6px">+ ${brl(f.bud)} de gastos do dia a dia (estimativa)</div>`:''}
  </div>`;
}

/* ======================= PLANEJAR: guardar dinheiro e metas =======================
   Tudo calculado em cima da projeção mês a mês (entradas para menos, contas para mais).
   "Sem ficar apertada(o)": sempre sobra um colchão na conta e nunca se guarda tudo o que sobra. */
function projMeses(n=24){
  MF_MEMO = {};
  try{
    const out = []; let saldo = null;
    for(let i=0;i<n;i++){
      const M = addM(THIS_MONTH,i), f = monthFlow(M);
      const sai = r2(f.outTot+f.bud), sobra = r2(f.inTot-sai);
      saldo = f.end!=null ? f.end : r2((saldo??0)+sobra);
      out.push({M, i, entra:f.inTot, sai, sobra, saldo});
    }
    return out;
  } finally { MF_MEMO = null; }
}
const floor10 = v => Math.max(0, Math.floor(v/10)*10);
function colchao(P){ // dinheiro que sempre fica na conta: 10% da renda média, no mínimo R$ 200
  const media = P.slice(0,6).reduce((t,p)=>t+p.entra,0)/Math.max(1,Math.min(6,P.length));
  return Math.max(200, Math.round(media*0.10/50)*50);
}
const minFut = (P,i) => Math.min(...P.slice(i).map(p=>p.saldo));
function fimDividas(M){ // dívidas cuja última parcela foi no mês anterior: o dinheiro fica livre a partir de M
  const prev = addM(M,-1);
  return db.debts.filter(d=>d.total>1 && debtEnd(d)===prev).map(d=>({nome:d.desc, credor:d.creditor, valor:d.value, folha:d.kind==='consignado'}));
}
function planoGuardar(){
  const P = projMeses(24), cx = colchao(P);
  // 1) a partir de quando dá: primeiro mês em que a conta fica acima do colchão daí em diante
  const i0 = P.findIndex((p,i)=>minFut(P,i) >= cx);
  const is13 = p => ['11','12'].includes(p.M.slice(5));
  let X = 0, fases = [];
  P.forEach(p=>{ p.guardar = 0; });
  if(i0>=0){
    // 2) valor FIXO por mês (70% da sobra típica, sem contar os meses do 13º)
    const reg = P.slice(i0).filter(p=>!is13(p)).map(p=>p.sobra).sort((a,b)=>a-b);
    const med = reg.length ? reg[Math.floor(reg.length/2)] : 0;
    X = floor10(0.7*med);
    const cabe = x => P.slice(i0).every((p,k)=> p.saldo - x*(k+1) >= cx);
    while(X>0 && !cabe(X)) X -= 10;
    // 3) bônus nos meses do 13º
    let acum = 0;
    P.forEach((p,i)=>{
      if(i<i0) return;
      let s = X;
      if(is13(p)){ const extra = floor10(Math.min(0.7*(p.sobra - X), minFut(P,i) - acum - X - cx)); if(extra>0){ s += extra; p.bonus = extra; } }
      p.guardar = s; acum += s;
    });
    if(X>0) fases.push({de:P[i0].M, ate:P[P.length-1].M, v:X});
  }
  let guardado = 0; P.forEach(p=>{ guardado += p.guardar; p.guardadoAcum = guardado; });
  const primeiro = P.find(p=>p.guardar>0);
  const bonus = P.filter(p=>p.bonus);
  const negativos = P.filter(p=>p.saldo<0);
  const pior = P.reduce((a,b)=>b.saldo<a.saldo?b:a, P[0]);
  const fixosMes = P[0] ? P[0].sai : 0;
  const reserva = Math.ceil(fixosMes*3/100)*100;
  const chegaReserva = P.find(p=>p.guardadoAcum>=reserva);
  return {P, cx, primeiro, X, bonus, fases, negativos, pior, reserva, chegaReserva, em12:P[11]?.guardadoAcum||0, em24:P[23]?.guardadoAcum||0};
}
function barrasSaldo(P, extra){ // gráfico: saldo previsto no fim de cada mês (verde acima de zero, rosa abaixo)
  const W=340, H=150, n=P.length, bw=(W-20)/n, vals=P.map(p=>extra?extra(p):p.saldo);
  const mx = Math.max(1,...vals.map(Math.abs)), zero = 75;
  const y = v => zero - v/mx*62;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="pbars" role="img" aria-label="Saldo previsto na conta, mês a mês">
    <line x1="10" x2="${W-10}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>`;
  vals.forEach((v,i)=>{ const x=10+i*bw+1, h=Math.max(1.5,Math.abs(y(v)-zero));
    s += `<rect x="${x}" y="${v>=0?zero-h:zero}" width="${Math.max(2,bw-2)}" height="${h}" rx="2" fill="${v>=0?'var(--pos)':'var(--neg)'}" opacity="${v>=0?.55:.65}"><title>${mLabel(P[i].M,{month:'short',year:'numeric'})}: ${brl(v)}</title></rect>`;
    if(i%3===0) s += `<text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${mShort(P[i].M)}${P[i].M.slice(5)==='01'?"'"+P[i].M.slice(2,4):''}</text>`; });
  return s+'</svg>';
}
function guardarView(){
  if(!db.salary && !db.tx.length) return `<div class="card"><div class="empty">Primeiro cadastre seu salário (ou suba seu holerite) para o Cofrivo planejar. 💗</div>
    <button class="btn" onclick="openHolerite()">📄 Subir holerite</button><button class="btn sec" onclick="openSalary()">Preencher salário</button></div>`;
  const G = planoGuardar(), P = G.P;

}

/* ---------- metas: compra ou viagem ---------- */
function avaliarMeta(m){
  const P = projMeses(36), cx = colchao(P);
  const iD = Math.max(0, diffM(THIS_MONTH, m.data.slice(0,7)));
  const guardado = m.guardado||0, valor = Math.max(0, m.valor - guardado);
  const impacto = (n, i0) => j => { // quanto a compra tira do saldo no mês j
    if(j < i0) return 0;
    if(!n || n<=1) return valor;
    const pagas = Math.min(n, j - i0 + (m.primeiraNoMes?1:0));
    return valor/n*Math.max(0,pagas);
  };
  const minDepois = (n,i0) => Math.min(...P.slice(i0).map((p,k)=>p.saldo - impacto(n,i0)(i0+k)));
  const n = m.forma==='parcelado' ? (m.parcelas||1) : 1;
  const sobraMin = minDepois(n, iD);
  const ok = sobraMin >= cx, apertado = ok && sobraMin < cx*2;
  let quando = null;
  if(!ok) for(let i=iD+1;i<P.length;i++){ if(minDepois(n,i) >= cx){ quando = P[i].M; break; } }
  const meses = iD+1, falta = Math.max(0, cx - sobraMin);
  const porMes = Math.ceil(falta/meses/10)*10;
  let parcelaOk = null;
  if(!ok) for(const k of [2,3,4,5,6,8,10,12]){ if(minDepois(k,iD) >= cx){ parcelaOk = k; break; } }
  return {P, cx, iD, ok, apertado, quando, porMes, falta, parcelaOk, sobraMin, saldoNaData:P[iD]?.saldo, n, valorRestante:valor,
    serie: p => p.i<iD ? p.saldo : p.saldo - impacto(n,iD)(p.i)};
}

function metaCard(m){
  const A = avaliarMeta(m), d = new Date(m.data+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  const pct = Math.min(100, Math.round((m.guardado||0)/m.valor*100));
  const verdict = A.ok ? (A.apertado ? ['⚠️','Dá, mas fica apertado','butter'] : ['✅','Dá para fazer!','mint']) : ['⏳','Ainda não dá nessa data','pink'];
  const oQueFazer = [];
  if(!A.ok){
    if(A.quando) oQueFazer.push(`<b>Adiar para ${mLabel(A.quando,{month:'long',year:'numeric'})}</b>: nessa data já cabe, sem ficar no aperto.`);
    const rendaMedia = A.P.slice(0,6).reduce((t,p)=>t+p.entra,0)/6;
    if(A.porMes>0 && A.porMes <= rendaMedia*0.3) oQueFazer.push(`<b>Guardar ou economizar ${brl(A.porMes)} por mês</b> até a data. Faltam ${brl(A.falta)} no total.`);
    else if(A.porMes>0) oQueFazer.push(`Nessa data faltariam <b>${brl(A.falta)}</b>: é muito para juntar em ${A.iD+1} ${A.iD?'meses':'mês'}. O melhor é adiar.`);

    if(!A.quando && !A.parcelaOk) oQueFazer.push(`Com as contas de hoje, ela não cabe nos próximos 3 anos. Primeiro siga o plano de <a href="#" onclick="st.simTab='guardar';render();return false">guardar dinheiro</a>.`);
  } else if(A.apertado) oQueFazer.push(`Depois da compra, a conta fica com pouca folga (${brl(A.sobraMin)} no pior mês). Guardar um pouco antes deixa tudo mais tranquilo.`);
  else oQueFazer.push(`Mesmo depois da compra, sobra pelo menos <b>${brl(A.sobraMin)}</b> na conta no pior mês.`);

    <ul class="tips" style="margin-top:8px">${oQueFazer.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="line" style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px"><span>Já guardado</span><b>${brl(m.guardado||0)} de ${brl(m.valor)}</b></div>
    <div class="prog" style="height:10px"><i style="width:${pct}%"></i></div>

      <p class="hint">Saldo previsto no fim de cada mês já descontando a meta. Fica sempre um colchão de ${brl(A.cx)}.</p></details>

/* ---------- controle de acesso (assinatura) ----------
   Enquanto ACESSO_CFG.url estiver vazio, o app funciona livre (como hoje).
   Com o servidor configurado: a pessoa digita o código de acesso uma vez; o app confere no servidor
   ao abrir (no máximo 1x por dia) e funciona sem internet por até 7 dias desde a última conferência.
   Se o acesso for removido (reembolso, cancelamento, vencido), o app bloqueia, mas os dados continuam
   no celular e a pessoa pode exportar um backup. */
const ACESSO_CFG = {url:'https://etcxpiwjmcjwwuyomceg.supabase.co', key:'sb_publishable_VQ-XW5YUXKc7jx_83GtK0g_k0Xm7QvV'}; // preenchido depois que o Supabase for criado (a chave "anon/publishable" é pública por natureza)
const ACESSO_KEY = 'cofrivo.acesso', DEV_KEY = 'cofrivo.dispositivo';
const ACESSO_ON = () => !!(ACESSO_CFG.url && ACESSO_CFG.key);
const acessoSalvo = () => { try { return JSON.parse(localStorage.getItem(ACESSO_KEY)||'null'); } catch(e){ return null; } };
function dispositivoId(){
  let id = localStorage.getItem(DEV_KEY);
  if(!id){ id = (crypto.randomUUID ? crypto.randomUUID() : uid()+uid()+uid()); localStorage.setItem(DEV_KEY,id); }
  return id;
}
async function checarAcesso(codigo){
  const r = await fetch(`${ACESSO_CFG.url}/rest/v1/rpc/checar_acesso`, {method:'POST',
    // chave nova (sb_publishable_…) vai só no "apikey"; a antiga (anon, começa com eyJ) também pode ir no Authorization
    headers:{'Content-Type':'application/json','apikey':ACESSO_CFG.key, ...(ACESSO_CFG.key.startsWith('eyJ')?{'Authorization':`Bearer ${ACESSO_CFG.key}`}:{})},
    body: JSON.stringify({p_codigo:codigo, p_dispositivo:dispositivoId()})});
  if(!r.ok) throw new Error('servidor '+r.status);
  return r.json();
}
const ACESSO_MSG = {
  invalido:   ['🔑','Código não encontrado','Confira se digitou certinho (letras e números). Se você acabou de comprar, o código chega no seu e-mail ou WhatsApp.'],
  reembolsado:['💗','Seu acesso foi encerrado','A compra foi reembolsada, então o acesso ao Cofrivo foi encerrado. Seus dados continuam neste celular: você pode exportar um backup.'],
  cancelado:  ['💗','Sua assinatura foi cancelada','O acesso ao Cofrivo foi encerrado. Seus dados continuam neste celular: você pode exportar um backup. Se quiser voltar, é só assinar de novo.'],
  bloqueado:  ['🔒','Acesso pausado','Seu acesso está pausado. Fale com quem te vendeu o Cofrivo. Seus dados continuam neste celular.'],
  vencido:    ['📅','Sua mensalidade venceu','Renove a assinatura para continuar usando. Seus dados continuam aqui, guardados neste celular.'],
  limite:     ['📱','Código em uso em outros aparelhos','Este código já está sendo usado no número máximo de aparelhos. Fale com o suporte para liberar.'],
  offline:    ['📶','Preciso de internet rapidinho','Faz mais de 7 dias que o app não confere seu acesso. Conecte-se à internet e toque em “Tentar de novo”.'],
  erro:       ['⚠️','Não consegui conferir agora','O servidor não respondeu. Tente de novo em instantes.'],
};
function telaAcesso(motivo, depois){
  const [ico,t,txt] = ACESSO_MSG[motivo] || ['🔑','Bem-vinda(o) ao Cofrivo','Digite o código de acesso que você recebeu na compra.'];
  const sv = acessoSalvo();
  $('#sheetbg').classList.add('open','intro');
  $('#sheet').innerHTML = `<div class="introbox">
    <div class="introico">${motivo?ico:appIcon()}</div><h2>${motivo?t:'Bem-vinda(o) ao Cofrivo'}</h2><p>${motivo?txt:'Digite o código de acesso que você recebeu na compra.'}</p>
    ${motivo==='offline'||motivo==='erro'?`<button class="btn" id="acTentar">Tentar de novo</button>`:''}
    ${motivo!=='offline'&&motivo!=='erro'?`<label class="f" style="text-align:left"><span>Código de acesso</span>
      <input id="acCodigo" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Ex.: COF-AB12-CD34" value="${motivo==='invalido'||!sv?'':esc(sv.codigo||'')}" style="text-transform:uppercase;letter-spacing:1px;text-align:center;font-size:18px"></label>
      <button class="btn" id="acEntrar">Entrar</button>`:''}
    ${['reembolsado','cancelado','bloqueado','vencido','limite'].includes(motivo) && (db.tx.length||db.debts.length||db.salary)?`<button class="btn sec" onclick="exportData()">💾 Exportar meus dados (backup)</button>`:''}
    <p class="hint" id="acMsg" style="text-align:center;margin-top:8px"></p></div>`;
  const entrar = async () => {
    const cod = ($('#acCodigo')?.value || sv?.codigo || '').trim().toUpperCase();
    if(!cod){ $('#acMsg').textContent = 'Digite seu código.'; return; }
    $('#acMsg').textContent = 'Conferindo…';
    try{
      const r = await checarAcesso(cod);
      if(r.ok){
        localStorage.setItem(ACESSO_KEY, JSON.stringify({codigo:cod, status:r.status, valido_ate:r.valido_ate, nome:r.nome, plano:r.plano, checado:Date.now()}));
        $('#sheetbg').classList.remove('open','intro'); render(); depois && depois();
      } else telaAcesso(r.status, depois);
    }catch(e){ $('#acMsg').textContent = 'Não consegui falar com o servidor. Verifique a internet.'; }
  };
  $('#acEntrar')?.addEventListener('click', entrar);
  $('#acCodigo')?.addEventListener('keydown', e=>{ if(e.key==='Enter') entrar(); });
  $('#acTentar')?.addEventListener('click', entrar);
}
async function verificarAcessoNaAbertura(depois){
  if(!ACESSO_ON()) return depois();
  const sv = acessoSalvo();
  if(!sv?.codigo) return telaAcesso('', depois);
  let idade = Date.now() - (sv.checado||0);
  if(!(idade >= 0)) idade = Infinity; // data no futuro ou inválida: obriga a conferir no servidor
  const venceu = sv.valido_ate && new Date(sv.valido_ate) < new Date();
  if(idade < 864e5 && !venceu) return depois();       // conferido há menos de 1 dia
  try{
    const r = await checarAcesso(sv.codigo);
    if(r.ok){ localStorage.setItem(ACESSO_KEY, JSON.stringify({...sv, status:r.status, valido_ate:r.valido_ate, nome:r.nome, plano:r.plano, checado:Date.now()})); return depois(); }
    localStorage.setItem(ACESSO_KEY, JSON.stringify({...sv, status:r.status, checado:Date.now()}));
    telaAcesso(r.status, depois);
  }catch(e){
    if(idade < 7*864e5 && !venceu) return depois();   // sem internet: funciona por até 7 dias
    telaAcesso('offline', depois);
  }
}
function acessoCard(){
  if(!ACESSO_ON()) return '';
  const sv = acessoSalvo(); if(!sv) return '';
  const mask = sv.codigo ? sv.codigo.replace(/.(?=.{4})/g,'•') : '';
  return `<div class="card"><h2>🔑 Seu acesso</h2>
    <p class="sub">${{ativo:'Assinatura ativa',cortesia:'Acesso cortesia',teste:'Período de teste'}[sv.status]||sv.status}${sv.valido_ate?` · válido até ${new Date(sv.valido_ate).toLocaleDateString('pt-BR')}`:''} · código ${mask}</p>
    <button class="btn sec" onclick="if(confirm('Sair deste código neste aparelho? Seus dados continuam aqui.')){localStorage.removeItem(ACESSO_KEY);telaAcesso('',()=>{})}">Usar outro código</button></div>`;
}

/* ---------- instalar na tela inicial ----------
   Android/Chrome/Edge: o navegador permite mostrar o pedido de instalação (beforeinstallprompt).
   iPhone/iPad: a Apple não permite pedir por código; mostramos o passo a passo do Safari. */
const INSTALL_KEY = 'cofrivo.install';
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
window.addEventListener('appinstalled', () => { localStorage.setItem(INSTALL_KEY,'instalado'); installEvt = null; });
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isIOSSafari = () => isIOS() && !/crios|fxios|edgios|gsa\//i.test(navigator.userAgent);
function maybeInstall(force){
  if(isStandalone()) return;
  const v = localStorage.getItem(INSTALL_KEY);
  if(!force && v && (v==='instalado' || Date.now()-(+v) < 7*864e5)) return; // pergunta de novo só depois de 7 dias
  if(!force && $('#sheetbg').classList.contains('open')) return;
  const passos = isIOS()
    ? (isIOSSafari()
      ? `<ol class="steps"><li>Toque em <b>Compartilhar</b> <span class="kbd">⬆︎</span> na barra do Safari.</li><li>Role e toque em <b>Adicionar à Tela de Início</b>.</li><li>Toque em <b>Adicionar</b>.</li></ol>`
      : `<p class="sub">No iPhone, abra este link no <b>Safari</b> (o app da bússola) e depois toque em <b>Compartilhar → Adicionar à Tela de Início</b>.</p>`)
    : installEvt ? '' :
      `<ol class="steps"><li>Abra o menu do navegador <span class="kbd">⋮</span>.</li><li>Toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li></ol>`;
  $('#sheetbg').classList.add('open','intro');
  $('#sheet').innerHTML = `<div class="introbox"><div class="introico">${appIcon()}</div>
    <h2>Colocar o Cofrivo na tela inicial?</h2>
    <p>Assim ele abre como um app, em tela cheia, e funciona até sem internet.</p>
    ${passos}
    ${installEvt?`<button class="btn" onclick="instalarAgora()">📲 Instalar agora</button>`:`<button class="btn" onclick="fecharInstall()">Entendi</button>`}
    <button class="btn sec" style="background:none" onclick="fecharInstall()">Agora não</button></div>`;
}
async function instalarAgora(){
  if(!installEvt) return fecharInstall();
  installEvt.prompt(); const r = await installEvt.userChoice; installEvt = null;
  localStorage.setItem(INSTALL_KEY, r.outcome==='accepted' ? 'instalado' : String(Date.now()));
  $('#sheetbg').classList.remove('open','intro');
}
function fecharInstall(){ localStorage.setItem(INSTALL_KEY, localStorage.getItem(INSTALL_KEY)==='instalado'?'instalado':String(Date.now())); $('#sheetbg').classList.remove('open','intro'); }

/* ---------- introdução (primeiro acesso) ---------- */

let introStep = 0;
function showIntro(step=0){
  introStep = step;
  const [ico,t,txt,kind] = INTRO[step], last = step===INTRO.length-1;
  $('#sheetbg').classList.add('open','intro');
  $('#sheet').innerHTML = `<div class="introbox">
    <div class="introico">${ico==='ICON'?appIcon():ico}</div><h2>${t}</h2><p>${txt}</p>
    ${kind==='id'?idButtons(`showIntro(${step})`)+`<p style="margin:4px 0 6px;font-size:14px">E o tema do app?</p>`+modeButtons(`showIntro(${step})`)+`<button class="btn" onclick="showIntro(${step+1})">Continuar</button>`:''}
    <div class="dots">${INTRO.map((_,i)=>`<i class="${i===step?'on':''}"></i>`).join('')}</div>
    ${last?`<button class="btn" onclick="endIntro('holerite')">📄 Subir meu holerite</button>
      <button class="btn sec" onclick="endIntro('salario')">Preencher meu salário à mão</button>
      <button class="btn sec" onclick="endIntro('dados')">Colar dados que recebi</button>
      <button class="btn sec" style="background:none" onclick="endIntro('lancar')">Só explorar o app</button>`
      : kind==='id' ? `<button class="btn sec" style="background:none" onclick="showIntro(${step+1})">Pular</button>`
      :`<button class="btn" onclick="showIntro(${step+1})">Próximo</button>
      <button class="btn sec" style="background:none" onclick="endIntro()">Pular introdução</button>`}
    ${step>0&&!last?`<button class="back" onclick="showIntro(${step-1})">‹ voltar</button>`:''}
  </div>`;
}
function endIntro(go){
  localStorage.setItem(INTRO_KEY,'1');
  if(!db.perfil) setGenero('n');
  $('#sheetbg').classList.remove('open','intro');
  if(go==='dados'){ st.view='mais'; st.maisTab='dados'; }
  if(go==='lancar'){ st.view='lancar'; }
  window.scrollTo(0,0); render();
  if(go==='holerite') setTimeout(openHolerite,50);
  if(!go || go==='lancar' || go==='dados') setTimeout(()=>maybeInstall(),1200);
  if(go==='salario') setTimeout(openSalary,50);
}

function manualView(){
  return `<div class="card"><h2>📖 Como usar o app</h2>
    <p class="sub">Toque em um tema para abrir.</p>
    ${MANUAL.map(([i,t,h],k)=>`<details class="tip-item manual" ${k===0?'open':''}><summary><span class="e">${i}</span>${t}</summary><div class="mtext">${h.replace('{mesma}',gw('você mesma','você mesmo','você'))}</div></details>`).join('')}

    <p class="hint">O ícone na tela inicial segue o tema escolhido no momento em que você adiciona o app. Para trocar o ícone depois, remova o atalho e adicione de novo.</p></div>`;
}

/* ---------- navegação ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;window.scrollTo(0,0);render()});
$('#prev').onclick=()=>{st.month=addM(st.month,-1);render()};
$('#next').onclick=()=>{st.month=addM(st.month,1);render()};
$('#gotoday').onclick=()=>{st.month=THIS_MONTH;render()};

render();
applyTheme();
function iniciarApp(){
  if(!localStorage.getItem(INTRO_KEY)) showIntro(0); else if(!db.perfil) showIdOnly(); else setTimeout(()=>maybeInstall(),2500);
}
verificarAcessoNaAbertura(iniciarApp);
// ao voltar para o app (ele pode ficar dias aberto em segundo plano): atualiza a data e confere o acesso
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  if(atualizarHoje() && !$('#sheetbg').classList.contains('open')) render();
  if(ACESSO_ON() && !$('#sheetbg').classList.contains('intro')) verificarAcessoNaAbertura(()=>{});
});

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
