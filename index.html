<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="theme-color" content="#fbf7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17151c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>Finanças</title>
<style>
:root{
  color-scheme:light;
  --bg:#fbf7f5; --card:#ffffff; --line:#f0e6ea; --ink:#2b2530; --ink2:#6e6573; --ink3:#a39aa8;
  --accent:#c94f7c; --on-accent:#ffffff; --accent-soft:#fde4ec;
  --mint:#d4f1e2; --pink:#fcdde8; --lilac:#e8e0fb; --butter:#fff2c9; --peach:#ffe4d3;
  --bar:#e0789f; --bar-dim:#f7cddc;
  --pos:#2c8560; --neg:#c8435a; --warn:#a86a00;
  --radius:20px; --shadow:0 2px 10px rgba(120,70,100,.07);
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#17151c; --card:#221f29; --line:#332f3b; --ink:#f4eff5; --ink2:#c9c0cc; --ink3:#8e8594;
  --accent:#f29ab9; --on-accent:#2b1720; --accent-soft:#3a2431;
  --mint:#1f3a30; --pink:#3d2532; --lilac:#2e2842; --butter:#3a3320; --peach:#3d2c22;
  --bar:#f29ab9; --bar-dim:#5a3445;
  --pos:#7fd6ad; --neg:#ff8fa3; --warn:#f0c060;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.monthnav{display:flex;align-items:center;justify-content:space-between}
.monthnav h1{font-size:20px;margin:0}
.monthnav button{width:40px;height:40px;border-radius:20px;font-size:22px;color:var(--accent)}
.monthnav button:active{background:var(--accent-soft)}
.monthnav .today{font-size:13px;color:var(--accent);height:auto;width:auto;padding:2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.card h2{font-size:15px;font-weight:600;margin:0 0 2px}
.card .sub{font-size:13px;color:var(--ink2);margin:0 0 12px}
.hero .label{font-size:13px;color:var(--ink2)}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-.5px;margin:2px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tile .label{font-size:12px;color:var(--ink2)}
.tile .val{font-size:19px;font-weight:650;margin-top:2px}
.tile .note{font-size:12px;color:var(--ink3);margin-top:2px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li.tap{cursor:pointer}
.list .main{flex:1;min-width:0}
.list .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .m{font-size:12px;color:var(--ink2)}
.list .amt{font-weight:600;white-space:nowrap;text-align:right}
.list .amt small{display:block;font-weight:400;font-size:12px;color:var(--ink3)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.prog{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.grouphead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.grouphead h2{margin:0}
.grouphead span{font-weight:650}
.empty{color:var(--ink2);font-size:14px;text-align:center;padding:24px 8px}
.catrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;font-size:14px}
.catrow .bar{grid-column:1/3;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.catrow .bar i{display:block;height:100%;background:var(--bar);border-radius:4px}
.catrow .v{color:var(--ink2)}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox text{font-size:10px;fill:var(--ink2)}
.chartbox text.vl{fill:var(--ink);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(88px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;background:var(--accent);color:#fff;font-size:30px;line-height:56px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center}
nav.tabs button{flex:1;max-width:140px;padding:8px 0 10px;font-size:11px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
/* modal */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{color:var(--accent);font-size:16px}
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;-webkit-appearance:none;appearance:none}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin:4px 0 8px}
.seg button{flex:1;padding:8px;border-radius:8px;font-size:15px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.check{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:15px}
.check input{width:22px;height:22px;-webkit-appearance:checkbox;appearance:checkbox}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;margin-top:14px;text-align:center}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:none;color:var(--neg);border:1px solid var(--line)}
.hint{font-size:12px;color:var(--ink3);margin-top:4px}
.preview{font-size:13px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px}
details summary{cursor:pointer;color:var(--ink2);font-size:14px;padding:6px 0}

/* ---------- tema pastel ---------- */
h1,h2,h3,.big,.val{font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",sans-serif}
.card{border:0;box-shadow:var(--shadow);animation:up .35s ease both}
.tiles .tile{border:0;animation:up .35s ease both}
.tiles .tile:nth-child(2){animation-delay:.04s}.tiles .tile:nth-child(3){animation-delay:.08s}.tiles .tile:nth-child(4){animation-delay:.12s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.t-mint{background:var(--mint)!important}.t-pink{background:var(--pink)!important}.t-lilac{background:var(--lilac)!important}.t-butter{background:var(--butter)!important}.t-peach{background:var(--peach)!important}
.tile .label{color:var(--ink2);font-weight:500}
.tile .note{color:var(--ink2);opacity:.85}
.hero{background:linear-gradient(135deg,var(--mint) 0%,var(--pink) 100%)!important;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--lilac);opacity:.55}
.hero > *{position:relative;z-index:1}
.hero .emoji{position:absolute;right:16px;top:14px;font-size:28px;z-index:2}
.btn{background:var(--accent);color:var(--on-accent);transition:transform .12s}
.btn:active,.fab:active,.list li.tap:active{transform:scale(.97)}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.fab{background:linear-gradient(135deg,#f39bbb,#c94f7c);box-shadow:0 6px 18px rgba(201,79,124,.35);transition:transform .12s}
.badge{background:var(--mint);color:var(--pos)}
.badge.pink{background:var(--pink);color:var(--accent)}
.badge.butter{background:var(--butter);color:var(--warn)}
.prog{height:8px;border-radius:4px}
.prog i{background:linear-gradient(90deg,#9edcbf,#f39bbb);border-radius:4px;transition:width .6s ease}
.catrow .bar i{background:linear-gradient(90deg,#f7cddc,var(--bar))}
nav.tabs{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav.tabs button.on svg{background:var(--accent-soft);border-radius:12px;padding:3px 10px;width:44px;box-sizing:content-box;margin:-3px -10px}
.sheet-bg{backdrop-filter:blur(2px)}
.sheet-bg.open .sheet{animation:sheet .28s cubic-bezier(.2,.8,.3,1)}
@keyframes sheet{from{transform:translateY(100%)}}
.sheet{border-radius:26px 26px 0 0}
.seg button.on{background:var(--pink);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bar-dim);border-color:var(--bar)}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--butter);border-radius:var(--radius);padding:14px 16px;margin:12px 0;cursor:pointer;animation:up .35s ease both}
.alert .ico{font-size:24px;line-height:1}
.alert b{display:block}
.alert span{font-size:13px;color:var(--ink2)}
.count{display:flex;align-items:baseline;gap:8px}
.count .big{font-size:44px}
.tip-item{border-top:1px solid var(--line);padding:4px 0}
.tip-item:first-of-type{border-top:0}
.tip-item summary{list-style:none;display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;padding:10px 0}
.tip-item summary::-webkit-details-marker{display:none}
.tip-item summary .e{font-size:20px;width:28px;text-align:center}
.tip-item summary::after{content:"›";margin-left:auto;color:var(--ink3);transition:transform .2s}
.tip-item[open] summary::after{transform:rotate(90deg)}
.tip-item p{margin:0 0 10px 38px;font-size:14px;color:var(--ink2)}
.chk{width:24px;height:24px;border-radius:12px;border:2px solid var(--bar);display:grid;place-items:center;flex:none;font-size:13px;color:var(--on-accent)}
.chk.on{background:var(--pos);border-color:var(--pos)}
.list li.done{opacity:.45}
.list li.done .t{text-decoration:line-through}
.list .dot{width:24px;flex:none;text-align:center;font-size:16px}
.list .chk{cursor:pointer;background:none}
.list .chk.on{background:var(--pos)}
.cycle.now{outline:2px solid var(--bar-dim)}
.result{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px}
.result b{font-size:18px;font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;white-space:nowrap}
.result.good{background:var(--mint);color:var(--pos)}
.result.bad{background:var(--pink);color:var(--neg)}
.result span{color:var(--ink)}
.need{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:10px}
.need .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0}
.need .line b:last-child{font-size:17px;font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;white-space:nowrap}
.need .line.big2{border-top:1px dashed var(--line);margin-top:4px;padding-top:8px}
.need .line.big2 b:last-child{font-size:20px}
.need .parts{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.6}
.cal .list li{border-top-color:rgba(0,0,0,.06)}
.cal .list li.payrow .t{font-weight:650}
.cal .list .t{white-space:normal}
.list .amt small{display:block}
nav.tabs button{font-size:10.5px}
.steps{margin:6px 0 0;padding-left:20px}
.steps li{margin:8px 0;font-size:14.5px}
.steps li small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.tips{list-style:none;margin:0;padding:0}
.tips li{padding:8px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
.tips li:first-child{border-top:0}
.tips li b{color:var(--ink)}
input.rate{width:58px;padding:6px 8px;font-size:14px;display:inline-block;margin-right:2px}
.noanim .card,.noanim .tile,.noanim .alert{animation:none!important}
.simbill{border-top:1px solid var(--line);padding:12px 0}
.simbill:first-of-type{border-top:0}
.simbill.on{background:var(--accent-soft);margin:4px 0;padding:12px;border-radius:14px;border-top-color:transparent}
.simbill .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.simbill .t{font-weight:600}.simbill .m{font-size:12px;color:var(--ink2)}
.seg.small button{font-size:13px;padding:7px 2px}
.simrow{border-top:1px solid var(--line);padding:10px 8px;margin:0 -8px}
.simrow.chg{background:var(--butter);border-radius:12px;border-top-color:transparent}
.simrow .h{font-size:14px;margin-bottom:6px}
.simrow .g{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
.simrow .g small{display:block;font-size:11px;color:var(--ink3)}
.simtab{width:100%;border-collapse:collapse;font-size:13.5px}
.simtab th{text-align:left;font-size:11px;color:var(--ink3);font-weight:600;padding:4px 4px 6px;text-transform:uppercase;letter-spacing:.3px}
.simtab td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.simtab td small{display:block;font-size:11px;color:var(--ink3)}
.simtab tr.chg td{background:var(--butter)}
.simtab tr.chg td:first-child{border-radius:10px 0 0 10px}.simtab tr.chg td:last-child{border-radius:0 10px 10px 0}
.dday{width:36px;flex:none;text-align:center;font:700 18px/1.1 ui-rounded,"SF Pro Rounded",-apple-system,sans-serif}
.dday small{display:block;font-size:10px;font-weight:500;color:var(--ink3);text-transform:uppercase}
.list .m b.neg,.sub.neg{color:var(--neg)}
</style>
</head>
<body>
<header><div class="wrap monthnav">
  <button id="prev" aria-label="Mês anterior">‹</button>
  <div style="text-align:center"><h1 id="mtitle"></h1><button class="today" id="gotoday" hidden>voltar para hoje</button></div>
  <button id="next" aria-label="Próximo mês">›</button>
</div></header>

<main class="wrap" id="view"></main>

<button class="fab" id="fab" aria-label="Adicionar">+</button>

<nav class="tabs">
  <button data-v="resumo" class="on"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumo</button>
  <button data-v="lanc"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Lançamentos</button>
  <button data-v="dividas"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Dívidas</button>
  <button data-v="plano"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Plano</button>
  <button data-v="ir"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v13a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>IR</button>
  <button data-v="dados"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Dados</button>
</nav>

<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------- utilidades ---------- */
const KEY = 'financas.v1';
const CATS = {
  out: ['Moradia','Alimentação','Mercado','Transporte','Saúde','Educação','Lazer','Compras','Assinaturas','Contas da casa','Cuidados pessoais','Pets','Outros'],
  in:  ['Salário','Freela/extra','Rendimentos','Reembolso','Outros']
};
const KINDS = {cartao:'Cartão (parcelado)', consignado:'Consignado (desconto em folha)', emprestimo:'Empréstimo', financiamento:'Financiamento', acordo:'Acordo/negociação', outro:'Outro'};

/* Tabelas 2026 — atualize aqui quando mudarem.
   INSS: Portaria Interministerial MPS/MF nº 13/2026. IRRF: tabela mensal (Lei 15.191/2025) + redutor da Lei 15.270/2025. */
const TAX = {
  inss: [[1621.00,.075],[2902.84,.09],[4354.27,.12],[8475.55,.14]],
  irrf: [[2428.80,0,0],[2826.65,.075,182.16],[3751.05,.15,394.16],[4664.68,.225,675.49],[Infinity,.275,908.73]],
  simplificado: 607.20, dependente: 189.59,
  redutor: {isento:5000, max:312.89, teto:7350, a:978.62, b:0.133145}
};
const FERIADOS = ['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'];
const pad = n => String(n).padStart(2,'0');
const now = new Date();
const TODAY = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const THIS_MONTH = TODAY.slice(0,7);
const money = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl = v => money.format(v||0);
const brlShort = v => v>=1000 ? 'R$ '+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil' : 'R$ '+Math.round(v);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const r2 = v => Math.round(v*100)/100;
function parseMoney(s){
  if(typeof s==='number') return s;
  s = String(s||'').trim().replace(/[R$\s]/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = Number(s); return isFinite(n) ? n : NaN;
}
function addM(ym,n){let [y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${pad(m)}`}
function diffM(a,b){const [ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (yb-ya)*12+(mb-ma)}
function mLabel(ym,opt={month:'long',year:'numeric'}){const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',opt)}
const mShort = ym => mLabel(ym,{month:'short'}).replace('.','');
const mShortY = ym => mLabel(ym,{month:'short',year:'2-digit'}).replace('.','').replace(' de ','/');
function dLabel(d){const [y,m,dd]=d.split('-');return `${dd}/${m}`}

/* ---------- dados ---------- */
function blank(){return {tx:[],fixed:[],debts:[]}}
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return blank()}}
let db = load();
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}

const instNo = (d,M) => diffM(d.firstMonth,M)+1;
const debtActive = (d,M) => {const n=instNo(d,M);return n>=1&&n<=d.total};
const debtEnd = d => addM(d.firstMonth,d.total-1);
const debtRemaining = (d,M) => d.value*Math.max(0,Math.min(d.total,d.total-instNo(d,M)+1)); // inclui a parcela do mês M
const fixedActive = (f,M) => f.start<=M && (!f.end || f.end>=M);

/* ---------- salário: projeção do holerite ---------- */
const trunc2 = v => Math.floor(v*100+1e-6)/100;
const pctTxt = a => (Math.round(a*1000)/10).toLocaleString('pt-BR')+'%';
function calcINSS(s){let t=0,prev=0;for(const [lim,a] of TAX.inss){if(s>prev)t+=trunc2((Math.min(s,lim)-prev)*a);prev=lim}return r2(t)}
function calcIR(rend,deducoes,semRedutor){
  const ded = Math.max(deducoes,TAX.simplificado), base = Math.max(0,rend-ded);
  const [,aliq,parc] = TAX.irrf.find(([lim])=>base<=lim);
  const bruto = Math.max(0,base*aliq-parc), R = TAX.redutor;
  let red = semRedutor ? 0 : rend<=R.isento ? R.max : rend<=R.teto ? Math.max(0,R.a-R.b*rend) : 0;
  red = Math.min(red,bruto);
  return {ir:trunc2(bruto-red), base:r2(base), aliq, red:trunc2(red), simpl:ded===TAX.simplificado&&deducoes<ded};
}
function payDate(M,day){ // dia útil anterior se cair em fim de semana/feriado nacional
  const [y,m]=M.split('-').map(Number); const d=new Date(y,m-1,day);
  while(d.getDay()===0||d.getDay()===6||FERIADOS.includes(`${pad(d.getMonth()+1)}-${pad(d.getDate())}`)) d.setDate(d.getDate()-1);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function salaryFor(M){
  const s = db.salary; if(!s) return null;
  const act = (s.actual||{})[M];
  if(M<s.since && !act) return null;
  const S=s.gross, inss=calcINSS(S), adv=r2(S*s.advPct/100);
  const vt = s.vtValue>0 ? Math.min(r2(S*0.06),s.vtValue) : 0;
  const consig = db.debts.filter(d=>d.kind==='consignado'&&debtActive(d,M));
  const consigSum = r2(consig.reduce((t,d)=>t+d.value,0));
  const others = (s.others||[]).filter(o=>o.value>0);
  const p5raw = r2(S-inss-adv-vt-(s.vr||0)-others.reduce((t,o)=>t+o.value,0)-consigSum);
  const irc = calcIR(S, inss+(s.deps||0)*TAX.dependente); // regime de caixa: saldo (dia 5) + adiantamento (dia 20) = salário do mês
  const p20raw = r2(adv-irc.ir);
  const lines5 = [['Salário base',S],['INSS',-inss],[`Adiantamento (já recebido dia 20)`,-adv]];
  if(vt) lines5.push(['Vale-transporte (6%)',-vt]);
  if(s.vr) lines5.push(['Desconto VR',-s.vr]);
  others.forEach(o=>lines5.push([o.desc,-o.value]));
  consig.forEach(d=>lines5.push([`Consignado ${d.desc} (${instNo(d,M)}/${d.total})`,-d.value]));
  const lines20 =[[`Adiantamento (${s.advPct}%)`,adv],[`IR do mês (${pctTxt(irc.aliq)}${irc.red?', com redutor':''})`,-irc.ir]];
  const mk = (key,label,date,raw,lines,note) => {
    const real = act?.[key]!=null;
    return {key,label,date,lines,note,real,raw,value:real?act[key]:Math.max(0,Math.floor(raw))};
  };
  const pays = [
    mk('p5','Saldo do salário',payDate(M,5),p5raw,lines5,'Referente ao mês anterior'),
    mk('p20','Adiantamento',payDate(M,20),p20raw,lines20,'O IR do mês inteiro é descontado aqui')
  ];
  // 13º salário: 1ª parcela (50%, sem descontos) até 30/11; 2ª até 20/12 com INSS e IR exclusivos
  if(s.decimo!==false){
    const mm = M.slice(5);
    if(mm==='11'){
      const d1 = r2(S/2);
      pays.push(mk('d1','13º — 1ª parcela',payDate(M,30),d1,[['50% do salário',d1]],'Sem descontos nesta parcela'));
    }
    if(mm==='12'){
      const d1 = r2(S/2), inss13 = calcINSS(S), ir13 = calcIR(S,inss13+(s.deps||0)*TAX.dependente);
      const raw = r2(S-d1-inss13-ir13.ir);
      pays.push(mk('d2','13º — 2ª parcela',payDate(M,20),raw,
        [['13º integral',S],['1ª parcela já recebida',-d1],['INSS do 13º',-inss13],[`IR do 13º (${pctTxt(ir13.aliq)}${ir13.red?', com redutor':''})`,-ir13.ir]],
        'Prazo legal: até 20/12. A data pode mudar na sua empresa'));
    }
  }
  return {M,pays,irc,inss,consigSum,total:r2(pays.reduce((t,p)=>t+p.value,0))};
}

function month(M){
  const tx = db.tx.filter(t=>t.date.slice(0,7)===M).sort((a,b)=>b.date.localeCompare(a.date));
  const fixed = db.fixed.filter(f=>fixedActive(f,M));
  const all = db.debts.filter(d=>debtActive(d,M)).map(d=>({...d,n:instNo(d,M)}));
  const sal = salaryFor(M);
  // consignados já saem do salário: só contam como saída se não houver salário configurado
  const inst = sal ? all.filter(d=>d.kind!=='consignado') : all;
  const folha = sal ? all.filter(d=>d.kind==='consignado') : [];
  const sum = (arr,type) => arr.filter(x=>x.type===type).reduce((s,x)=>s+x.value,0);
  const inc = sum(tx,'in')+sum(fixed,'in')+(sal?sal.total:0);
  const imv = imovelFor(M);
  const outVar = sum(tx,'out'), outFixed = sum(fixed,'out')+(imv?imv.value:0);
  const outInst = inst.reduce((s,d)=>s+d.value,0), outFolha = folha.reduce((s,d)=>s+d.value,0);
  const out = outVar+outFixed+outInst;
  return {tx,fixed,inst,folha,sal,imv,inc,outVar,outFixed,outInst,outFolha,out,saldo:inc-out};
}

/* ---------- gráfico: parcelas nos próximos 12 meses (série única) ---------- */
function chartData(){
  return Array.from({length:12},(_,i)=>{const M=addM(st.month,i);
    const ds=db.debts.filter(d=>debtActive(d,M));
    return {M,v:ds.reduce((s,d)=>s+d.value,0),n:ds.length,inc:month(M).inc}});
}
function chartSVG(){
  const data = chartData(), W=340, H=170, top=22, base=H-22, bw=20, gap=(W-12*bw)/12;
  const max = Math.max(...data.map(d=>d.v),1);
  const maxI = data.findIndex(d=>d.v===max);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Parcelas por mês nos próximos 12 meses">`;
  s += `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
  data.forEach((d,i)=>{
    const x = gap/2+i*(bw+gap), h = d.v ? Math.max(3,(d.v/max)*(base-top)) : 0, y = base-h, r = Math.min(4,h);
    if(h) s += `<path d="M${x},${base} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${base} Z" fill="${i===0?'var(--bar)':'var(--bar-dim)'}"/>`;
    s += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${mShort(d.M)}</text>`;
    if((i===0||i===maxI) && d.v) s += `<text class="vl" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${brlShort(d.v)}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${x-gap/2}" y="0" width="${bw+gap}" height="${H}" fill="transparent"/>`;
  });
  return s+'</svg>';
}
function bindChart(){
  const box = $('#chart'); if(!box) return;
  const data = chartData(), tip = $('#tip'), svg = box.querySelector('svg');
  const show = e => {
    const t = e.target.closest('.hit'); if(!t){tip.style.display='none';return}
    const d = data[+t.dataset.i], bb = t.getBoundingClientRect(), cb = box.getBoundingClientRect();
    tip.innerHTML = `<b>${mLabel(d.M)}</b><br>${brl(d.v)} em ${d.n} parcela${d.n===1?'':'s'}${d.inc?` · ${Math.round(d.v/d.inc*100)}% da renda`:''}`;

}

/* ---------- apartamento financiado (Caixa) ----------
   Fase de obra: paga juros sobre o que a Caixa já liberou à construtora + seguros (MIP/DFI) + tarifa.
   Conforme a obra avança, a liberação cresce e a parcela sobe. Depois das chaves começa a amortização (SAC).
   Tudo estimado PARA CIMA: juros padrão 13,5% a.a. (SBPE até 11,49% + TR, arredondado para cima). */
const IMOVEL_DEFAULT = {nome:'Apartamento (Caixa)',day:20,ref:'2026-11',parcelaRef:726.14,taxas:85,juros:13.5,tr:2,obraPct:50,fimObra:'2027-11',prazo:420,financiado:0,actual:{}};
function imovelCalc(){
  const im = {...IMOVEL_DEFAULT,...db.imovel};
  // juros nominais ao ano ÷ 12 + TR estimada (para cima)
  const i = im.juros/1200 + (Math.pow(1+(im.tr||0)/100,1/12)-1);
  let F, fees = im.taxas;
  if(im.financiado>0){
    F = im.financiado;
    // seguros + tarifa calculados a partir da parcela real (se não informados)
    if(im.taxasAuto!==false) fees = r2(Math.max(25, im.parcelaRef - F*(im.obraPct/100)*i));
  } else F = Math.max(0,(im.parcelaRef-im.taxas))/((im.obraPct/100)*i);
  im.taxas = fees;
  return {im,i,F};
}
function imovelFor(M){
  if(!db.imovel) return null;
  const {im,i,F} = imovelCalc(); // im.taxas já calibrado
  if(M<im.ref) return null;
  const act = (im.actual||{})[M];
  if(act!=null) return {value:act,real:true,fase:M<=im.fimObra?'obra':'sac'};
  if(M===im.ref) return {value:im.parcelaRef,real:true,fase:'obra',pct:im.obraPct};
  if(M<=im.fimObra){
    const tot = Math.max(1,diffM(im.ref,im.fimObra)), t = diffM(im.ref,M);
    const pct = Math.min(100, im.obraPct+(100-im.obraPct)*t/tot);
    let v = ceil2(im.taxas+F*(pct/100)*i);
    if(im.parcelaPos>0) v = Math.min(v, im.parcelaPos); // na obra paga só juros: não passa da parcela cheia
    return {value:v,fase:'obra',pct};
  }
  const k = diffM(im.fimObra,M), amort = F/im.prazo, saldo = Math.max(0,F-amort*(k-1));
  if(k>im.prazo) return null;
  // valor do contrato: mantido fixo (no SAC ela cai devagar, mas a TR corrige — fica "para cima")
  if(im.parcelaPos>0) return {value:im.parcelaPos,fase:'sac',contrato:true};
  return {value:ceil2(amort+saldo*i+im.taxas),fase:'sac'};
}
function openImovel(){
  const im = {...IMOVEL_DEFAULT,...db.imovel};
  const {F} = imovelCalc();
  const f = (id,label,val,hint='',type='decimal') => `<label class="f"><span>${label}</span><input id="${id}" ${type==='month'?'type="month"':`inputmode="${type}"`} value="${val}">${hint?`<div class="hint">${hint}</div>`:''}</label>`;

  openSheet(`<h3>🏢 Apartamento <button onclick="closeSheet()">Fechar</button></h3>
    <p class="sub" style="color:var(--ink2);font-size:13px;margin-top:-4px">Na fase de obra você paga juros sobre o que a Caixa já liberou para a construtora, mais seguros e tarifa. A parcela sobe conforme a obra avança. Depois das chaves começa a parcela "cheia".</p>
    <div class="row">${f('im_val','Parcela paga (R$)',br(im.parcelaRef))}${f('im_ref','no mês',im.ref,'','month')}</div>
    <div class="row">${f('im_pct','% da obra hoje',br(im.obraPct),'Veja no app Habitação Caixa')}${f('im_fim','Previsão das chaves',im.fimObra,'','month')}</div>
    <div class="row">${f('im_juros','Juros nominais ao ano (%)',br(im.juros),'Está no contrato')}${f('im_tr','TR estimada ao ano (%)',br(im.tr??2),'Correção do saldo; usamos para cima')}</div>
    <div class="row">${f('im_tx','Seguros + tarifa (R$/mês)',im.financiado&&im.taxasAuto!==false?'':br(im.taxas),im.financiado?`Vazio = calcular pela parcela (~${brl(imovelCalc().im.taxas)})`:'')}<div></div></div>
    <div class="row">${f('im_fin','Valor financiado (R$)',im.financiado?br(im.financiado):'','Deixe vazio para estimar')}${f('im_prazo','Prazo (meses)',im.prazo,'','numeric')}</div>
    ${!im.financiado?`<div class="hint">Valor financiado estimado a partir da parcela: ~${brl(F)}</div>`:''}
    <div class="row">${f('im_pos','1ª parcela após as chaves (R$)',im.parcelaPos?br(im.parcelaPos):'','Do contrato. Vazio = estimar')}${f('im_day','Dia do pagamento',im.day,'','numeric')}</div>
    <button class="btn" onclick="saveImovel()">Salvar</button>

  if(!db.imovel) return `<div class="card"><h2>🏢 Financiamento do apartamento</h2><p class="sub">Ainda não cadastrado</p><button class="btn sec" onclick="openImovel()">Cadastrar</button></div>`;

    ${first?`<div class="result bad"><span>Depois das chaves (${mShortY(first[0])}) a parcela passa para cerca de</span><b>${brl(first[1].value)}</b></div>`:''}
    <button class="btn sec" onclick="openImovel()">Ajustar dados do contrato</button></div>`;
}

/* ---------- blocos de pagamento: dia 5 e dia 20 ----------
   Bloco "A" do mês M: recebe o pagamento do dia 5 e paga o que vence de 05 a 19.
   Bloco "B" do mês M: recebe o pagamento do dia 20 e paga o que vence de 20 até 04 do mês seguinte. */
const DAY_DEFAULT = 10;
const cycleOf = date => {const d=+date.slice(8), M=date.slice(0,7); return d<5 ? addM(M,-1)+'B' : d<20 ? M+'A' : M+'B'};
const nextCycle = id => id.endsWith('A') ? id.slice(0,7)+'B' : addM(id.slice(0,7),1)+'A';
function cycleInfo(id){
  const M=id.slice(0,7), A=id.endsWith('A');
  return {id,M,A,pay:A?`${M}-05`:`${M}-20`,from:A?`${M}-05`:`${M}-20`,to:A?`${M}-19`:`${addM(M,1)}-04`};
}
let EV_CACHE = null; // acelera o plano de ação (muitos cálculos seguidos)
function events(M){
  if(EV_CACHE){
    if(!EV_CACHE[M]){ const s=SIM; SIM=null; EV_CACHE[M]=eventsRaw(M); SIM=s; }
    return SIM ? applySim(EV_CACHE[M],M) : EV_CACHE[M];
  }
  return eventsRaw(M);
}
function eventsRaw(M){ // tudo que entra e sai no mês M, com data e chave
  const m = month(M), ev = [];
  const dim = new Date(+M.slice(0,4), +M.slice(5), 0).getDate();
  const dt = day => `${M}-${pad(Math.min(day||DAY_DEFAULT,dim))}`;
  if(m.sal) m.sal.pays.forEach(p=>ev.push({key:`sal:${p.key}:${M}`,date:p.date,
    nominal:p.key==='p5'?`${M}-05`:(p.key==='p20'||p.key==='d2')?`${M}-20`:p.date,
    label:p.label,v:p.value,icon:'💰',tap:`st.month='${M}';openPay('${p.key}')`,tag:p.real?'valor real':'previsto'}));
  (db.ferias||[]).forEach(f=>{const c=feriasCalc(f); if(c && c.payDate.slice(0,7)===M) ev.push({key:`fer:${f.id}`,date:c.payDate,
    label:`Férias (${f.dias} dias${f.abono?` + venda de ${f.abono}`:''})`,v:c.liquido,icon:'🏖️',tap:"st.view='plano';render()",tag:'previsto'});
    // os dias de férias já foram pagos antes: o salário do dia 5 seguinte vem menor
    if(c) c.descontos.filter(x=>x.mes===M).forEach(x=>ev.push({key:`ferdesc:${f.id}:${M}`,date:payDate(M,5),nominal:`${M}-05`,
      label:`Desconto no salário: ${x.dias} dias de férias já pagos`,sub:'sai do salário do dia 5',v:-x.valor,icon:'🏖️',tap:"st.view='plano';render()",auto:true}))});
  if(m.imv) ev.push({key:`imovel:${M}`,date:dt(db.imovel.day||20),label:db.imovel.nome||'Apartamento (Caixa)',
    sub:m.imv.real?'valor real':m.imv.fase==='obra'?`fase de obra · ~${Math.round(m.imv.pct)}% da obra · estimativa`:`após as chaves (SAC) · estimativa`,
    v:-m.imv.value,icon:'🏢',tap:'openImovel()'});
  m.fixed.forEach(f=>ev.push({key:`fx:${f.id}:${M}`,date:dt(f.day),label:f.desc,v:f.type==='in'?f.value:-f.value,icon:f.type==='in'?'💰':'🏠',tap:`openTx('${f.id}',true)`}));
  m.tx.forEach(t=>ev.push({key:`tx:${t.id}`,date:t.date,label:t.desc,v:t.type==='in'?t.value:-t.value,icon:t.type==='in'?'💰':'🛍️',tap:`openTx('${t.id}')`}));
  m.inst.forEach(d=>ev.push({key:`debt:${d.id}:${M}`,date:dt(d.day),label:d.desc,sub:`${d.creditor}${d.total>1?` · parcela ${d.n}/${d.total}`:''}`,v:-d.value,icon:'💳',tap:`openDebt('${d.id}')`,debtId:d.id,creditor:d.creditor,kind:d.kind,dtotal:d.total}));
  return SIM ? applySim(ev,M) : ev;
}
function cycleEvents(id){
  const c = cycleInfo(id), b = db.balance, ev = [];
  [c.M, addM(c.M,1)].forEach(M=>events(M).forEach(e=>{ if(cycleOf(e.nominal||e.date)===id) ev.push(e) }));
  if(db.budget>0){
    let v = db.budget/2;
    if(b && b.date>=c.from && b.date<=c.to) v = v*daysBetween(b.date,c.to)/(daysBetween(c.from,c.to)+1);
    v = ceil2(v); // gasto: arredonda para mais
    if(v>0) ev.push({key:`bud:${id}`,date:c.to,label:'Gastos do dia a dia (estimativa)',v:-v,icon:'🛒',tap:'openBalance()',budget:true});
  }
  const paid = db.paid||{};
  ev.forEach(e=>{
    e.paid = !!paid[e.key];
    const bAt = b ? (b.at || b.date+'T00:00:00') : '';
    e.done = !!b && (e.date<=b.date || (e.paid && paid[e.key]<bAt)); // já está dentro do saldo informado
    e.late = e.v<0 && !e.paid && !e.done && !e.budget && e.date<TODAY;
  });
  return ev.sort((x,y)=>(y.v>0)-(x.v>0) || x.date.localeCompare(y.date));
}
const evSum = ev => r2(ev.filter(e=>!e.done).reduce((s,e)=>s+e.v,0));
function plan(id){
  const b = db.balance;
  let start, opening = 0, fromBalance = false;
  if(b){ start = cycleOf(b.date); if(id<start) return {past:true,c:cycleInfo(id),ev:cycleEvents(id)}; opening = b.value; fromBalance = true; }
  else start = id.slice(0,7)+'A';

function wd(date){const [y,m,d]=date.split('-').map(Number);return ['dom','seg','ter','qua','qui','sex','sáb'][new Date(y,m-1,d).getDay()]}
function cycleSum(id){

  const budget = r2(live.filter(e=>e.budget).reduce((s,e)=>s-e.v,0));

/* ---------- plano de ação: não fechar no vermelho ----------
   Taxas mensais estimadas, sempre arredondadas PARA CIMA (o real tende a ser igual ou menor).
   Referências (nov/2026): BC — parcelado do cartão ~9,3% a.m. (média), rotativo ~15–16% a.m. (média);
   cheque especial: teto legal de 8% a.m. (Res. CMN 4.765/2019); IOF de crédito para PF: 0,38% + até 3% ao ano. */
const RATE_DEFAULT = {parc:10, rot:16, cheque:8};
const RATE_BANKS = {
  'Santander': {parc:10, rot:16},
  'Itaú':      {parc:10, rot:16, cheque:8},
  'Carrefour': {parc:13, rot:20},
};
const IOF_MAX = 0.0338; // 0,38% fixo + até 3% — usamos o máximo
function rateFor(creditor,type){
  const r = (db.rates||{})[creditor] || RATE_BANKS[creditor] || {};
  return (r[type] ?? RATE_DEFAULT[type]);
}
const ceil2 = v => Math.ceil(v*100-1e-6)/100;
function parcelamento(P, ratePct, n){
  const i = ratePct/100, base = P*(1+IOF_MAX);
  const pmt = ceil2(i ? base*i/(1-Math.pow(1+i,-n)) : base/n);
  return {n, pmt, total:r2(pmt*n), juros:r2(pmt*n-P)};
}
const isCheque = e => /cheque especial/i.test(e.label||'');
const parcelable = e => e.v<0 && !e.paid && !e.done && e.debtId && e.dtotal===1 && (e.kind==='cartao' || isCheque(e));
function planHorizon(){ return simHorizon(); }
const PLAN_CYCLES = 24; // 12 meses
function fastRows(n){ // saldo ao fim de cada pagamento, encadeado, em uma passada só
  const b = db.balance, now = cycleOf(TODAY);
  let cur = b ? cycleOf(b.date) : now, open = b ? b.value : 0;
  if(cur>now) cur = now;
  const rows = [];
  while(rows.length<n){
    const ev = cycleEvents(cur), close = r2(open+evSum(ev));
    if(cur>=now) rows.push({c:cycleInfo(cur),closing:close});
    open = close; cur = nextCycle(cur);
  }
  return rows;
}
function evalSim(sim){ return withSim(sim, ()=>fastRows(PLAN_CYCLES)); }
const worst = rows => rows.reduce((m,s)=>s.closing<m.closing?s:m, rows[0]);
function candidates(){
  const out = [];
  planHorizon().forEach(id=>{const s=cycleSum(id); if(!s.past) s.bills.filter(parcelable).forEach(e=>out.push({e,rate:rateFor(e.creditor,isCheque(e)?'cheque':'parc')}))});
  return out;
}
function simEntry(e,opt){return {mode:'split',n:opt.n,val:opt.pmt,date:e.date,label:e.label,total:-e.v}}
const NS = [2,3,4,5,6,8,10,12,18,24];
function suggestPlan(){ EV_CACHE = {}; try { return suggestPlanInner(); } finally { EV_CACHE = null; } }
function suggestPlanInner(){
  const base = evalSim({});
  if(worst(base).closing>=0) return {ok:true,steps:[],rows:base,base};
  const cands = candidates();
  const cost = s => Object.values(s).reduce((t,x)=>t+(x.n*x.val-x.total),0);
  // nota: viável (nunca fica no vermelho) sempre vence; entre viáveis, menos juros;
  // entre não viáveis, a menor falta no pior momento.
  const score = s => { const w = worst(evalSim(s)).closing; return w>=0 ? 1e9-cost(s) : w - cost(s)*1e-4; };
  const set = (s,c,n) => { const t={...s}; if(n) t[c.e.key]=simEntry(c.e,parcelamento(-c.e.v,c.rate,n)); else delete t[c.e.key]; return t; };
  const OPTS = [0,...NS];
  // 1) todas as combinações das 3 maiores contas
  const big = [...cands].sort((a,b)=>a.e.v-b.e.v).slice(0,3);
  let best = {}, bestScore = score({});
  const rec = (i,cur) => {
    if(i===big.length){ const sc=score(cur); if(sc>bestScore){best=cur;bestScore=sc} return; }
    for(const n of OPTS) rec(i+1,set(cur,big[i],n));
  };
  rec(0,{});
  // 2) ajuste fino com todas as contas, uma mudança por vez
  for(let it=0; it<12; it++){
    let move=null;
    for(const c of cands) for(const n of OPTS){
      const t=set(best,c,n), sc=score(t);
      if(sc>(move?move.sc:bestScore)+0.01) move={s:t,sc};
    }
    if(!move) break;
    best=move.s; bestScore=move.sc;
  }
  const steps = cands.filter(c=>best[c.e.key]).map(c=>{const x=best[c.e.key];return {e:c.e,rate:c.rate,opt:{n:x.n,pmt:x.val,total:r2(x.n*x.val),juros:r2(x.n*x.val-x.total)}}});
  const rows = evalSim(best);
  return {ok:worst(rows).closing>=0, steps, rows, base, sim:best};
}

/* ---------- férias: quanto entra (sempre para menos) ----------
   Recebe até 2 dias antes: dias de férias + 1/3. Se vender dias (abono pecuniário, até 1/3), recebe esses dias + 1/3, sem INSS e sem IR.
   INSS: a parte das férias no INSS do mês. IR: calculado à parte, sem o redutor (para menos).
   Depois, o salário do dia 5 seguinte vem menor, porque os dias de férias já foram pagos. */
const FERIAS_SALDO = 45;
const FOLHA_FECHA = 12; // dia em que a folha da empresa fecha
function feriasCalc(f){
  const s = db.salary; if(!s) return null;
  const S = s.gross, dia = S/30;
  const fer = r2(dia*f.dias), terco = r2(fer/3), ab = r2(dia*(f.abono||0)), abTerco = r2(ab/3);
  const inss = r2(Math.max(0, calcINSS(Math.min(S+terco, TAX.inss[TAX.inss.length-1][0])) - calcINSS(Math.max(0,S-fer))));
  const ir = calcIR(fer+terco, inss+(s.deps||0)*TAX.dependente, true).ir;
  const bruto = r2(fer+terco+ab+abTerco);
  const liquido = Math.max(0, Math.floor(bruto-inss-ir));
  const d = new Date(f.start+'T12:00'); d.setDate(d.getDate()-2);
  while(d.getDay()===0||d.getDay()===6||FERIADOS.includes(`${pad(d.getMonth()+1)}-${pad(d.getDate())}`)) d.setDate(d.getDate()-1);
  // sai do salário do dia 5 seguinte: o valor dos dias menos o INSS que já foi pago nas férias (o IR não abatemos: fica para menos)
  const desconto = ceil2(fer - Math.max(0, calcINSS(S) - calcINSS(Math.max(0,S-fer))));
  // a folha fecha todo dia 12: dias de 13/(X-1) a 12/X entram na competência X, paga no dia 5 de X+1
  const porDia = desconto/f.dias, comp = {};
  for(let k=0;k<f.dias;k++){
    const dt = addDays(f.start,k), dd = +dt.slice(8), M = dt.slice(0,7);
    const C = dd<=FOLHA_FECHA ? M : addM(M,1);
    comp[C] = (comp[C]||0)+1;
  }
  const descontos = Object.entries(comp).sort().map(([C,n])=>({comp:C, mes:addM(C,1), dias:n, valor:ceil2(porDia*n)}));
  return {fer,terco,ab,abTerco,inss,ir,bruto,liquido,payDate:iso(d),desconto,descontos,
    ganho:Math.floor(liquido-descontos.reduce((t,x)=>t+x.valor,0)), volta:addDays(f.start,f.dias), descMes:descontos[0]?.mes};
}

  ['🚫','O que NÃO entra','Academia, nutricionista, remédios de farmácia, óculos, vacinas em farmácia, cursos livres e de idiomas não são dedutíveis. Não declare o que não pode comprovar: isso leva à malha fina.'],

  ['⚡','Entregue cedo e use a pré-preenchida','A restituição sai em lotes. Quem usa a declaração pré-preenchida e informa uma chave PIX igual ao CPF tem prioridade. Para isso, a conta gov.br precisa ser prata ou ouro.'],

];
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s,n) => {const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const daysBetween = (a,b) => Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
function lastBizDay(y,m){const d=new Date(y,m,0);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);return iso(d)}
function irInfo(){
  const dates = Y => {const o=(db.irDates||{})[Y];return {start:o?.start||`${Y}-03-16`,end:o?.end||lastBizDay(Y,5),official:!!o}};
  let Y = now.getFullYear(), d = dates(Y);
  if(TODAY>d.end){Y++; d=dates(Y)}
  return {Y, base:Y-1, ...d, phase:TODAY<d.start?'antes':'aberto', toStart:daysBetween(TODAY,d.start), toEnd:daysBetween(TODAY,d.end)};
}
function deductibles(year){
  const items = [];
  db.tx.filter(t=>t.type==='out'&&t.ded&&t.date.startsWith(year))
    .forEach(t=>items.push({src:'tx',id:t.id,desc:t.desc,ded:t.ded,value:t.value,nf:!!t.nf,when:dLabel(t.date)}));
  db.fixed.filter(f=>f.type==='out'&&f.ded).forEach(f=>{
    let n=0; for(let i=1;i<=12;i++) if(fixedActive(f,`${year}-${pad(i)}`)) n++;
    if(n) items.push({src:'fixed',id:f.id,desc:f.desc,ded:f.ded,value:r2(f.value*n),nf:!!f.nf,when:`fixo, ${n} ${n===1?'mês':'meses'}`});
  });
  const saude = r2(items.filter(i=>i.ded==='saude').reduce((t,i)=>t+i.value,0));
  const edu = r2(items.filter(i=>i.ded==='educacao').reduce((t,i)=>t+i.value,0));
  const eduOk = Math.min(edu,EDU_LIMIT);
  return {items,saude,edu,eduOk,total:saude+eduOk,semNf:items.filter(i=>!i.nf)};
}
function toggleNf(src,id){const x=(src==='fixed'?db.fixed:db.tx).find(t=>t.id===id); if(x){x.nf=!x.nf; save()}}
function irBanner(){
  const i = irInfo();
  let msg;
  if(i.phase==='aberto') msg = [`Faltam ${i.toEnd} dias para declarar o IR`,`O prazo vai até ${dLabel(i.end)}. Quanto antes, mais cedo sai a restituição.`];
  else if(i.toStart<=75) msg = [`A declaração do IR abre em ${i.toStart} dias`,`Já vá separando informes e recibos de ${i.base}.`];
  else {const d=deductibles(String(i.base)); if(!d.semNf.length) return '';
    msg = [`${d.semNf.length} gasto${d.semNf.length>1?'s':''} dedutíve${d.semNf.length>1?'is':'l'} sem recibo`,'Peça a nota agora para não perder a dedução no IR.'];}
  return `<div class="alert" onclick="st.view='ir';render()"><span class="ico">🔔</span><div><b>${msg[0]}</b><span>${msg[1]}</span></div></div>`;
}
function openIrDates(){
  const i = irInfo();
  openSheet(`<h3>Datas da declaração ${i.Y} <button onclick="closeSheet()">Fechar</button></h3>
    <p class="sub" style="color:var(--ink2);font-size:13px">A Receita divulga as datas oficiais geralmente entre fevereiro e março. Até lá, o app usa uma previsão.</p>
    <div class="row"><label class="f"><span>Início</span><input type="date" id="irs" value="${i.start}"></label>
    <label class="f"><span>Prazo final</span><input type="date" id="ire" value="${i.end}"></label></div>
    <button class="btn" onclick="saveIrDates(${i.Y})">Salvar</button>
    ${i.official?`<button class="btn danger" onclick="delete db.irDates[${i.Y}];closeSheet();save()">Voltar para a previsão</button>`:''}`);
}
function saveIrDates(Y){
  const s=$('#irs').value, e=$('#ire').value;
  if(!s||!e||e<s) return alert('Confira as datas.');
  db.irDates = db.irDates||{}; db.irDates[Y] = {start:s,end:e}; closeSheet(); save();
}
function downloadICS(){
  const i = irInfo(), dt = s => s.replace(/-/g,'');
  const evs = [
    [`${i.Y}-02-27`,'IR: separar informes e recibos','Informe de rendimentos da empresa e dos bancos + recibos de saúde e educação.'],
    [i.start,'IR: começou a declaração!','Use a pré-preenchida (gov.br prata/ouro) e PIX no CPF para ter prioridade na restituição.'],
    [addDays(i.end,-15),'IR: faltam 15 dias para o prazo','Ainda dá tempo, mas não deixe para a última hora.'],
    [addDays(i.end,-3),'IR: faltam 3 dias!','Último aviso antes do prazo final.'],
    [i.end,'IR: último dia para declarar','O prazo termina às 23h59 de hoje.']
  ].filter(([d])=>d>=TODAY);
  const stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Financas//IR//PT','CALSCALE:GREGORIAN'];
  evs.forEach(([d,t,desc])=>lines.push('BEGIN:VEVENT',`UID:${uid()}-${dt(d)}@financas`,`DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${dt(d)}`,`DTEND;VALUE=DATE:${dt(addDays(d,1))}`,`SUMMARY:${t}`,`DESCRIPTION:${desc}`,
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${t}`,'TRIGGER:PT9H','END:VALARM','END:VEVENT'));
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `lembretes-ir-${i.Y}.ics`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------- importação / backup ---------- */
// Aceita o formato do backup e um formato simplificado (para dados gerados pelo Claude):
// debts: {desc, creditor, value, total, firstMonth}  OU  {..., current, refMonth?}
// tx:    {type:"in"|"out", desc, value, date:"AAAA-MM-DD", cat}
// fixed: {type, desc, value, cat, start:"AAAA-MM", day?, end?}
function normalize(data){
  const out = blank(), errs = [];
  const num = v => r2(parseMoney(v));
  (data.debts||[]).forEach((d,i)=>{
    const value=num(d.value), total=parseInt(d.total);
    let first = d.firstMonth;
    if(!first && d.current) first = addM(d.refMonth||THIS_MONTH,-(parseInt(d.current)-1));
    if(!d.desc||!(value>0)||!(total>=1)||!/^\d{4}-\d{2}$/.test(first||'')) return errs.push(`dívida ${i+1} (${d.desc||'?'})`);
    out.debts.push({id:d.id||uid(),desc:d.desc,creditor:d.creditor||'Outros',kind:KINDS[d.kind]?d.kind:'cartao',value,total,day:parseInt(d.day)||null,firstMonth:first});
  });
  (data.tx||[]).forEach((t,i)=>{
    const value=num(t.value);
    if(!t.desc||!(value>0)||!/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')) return errs.push(`lançamento ${i+1} (${t.desc||'?'})`);
    out.tx.push({id:t.id||uid(),type:t.type==='in'?'in':'out',desc:t.desc,value,date:t.date,cat:t.cat||'Outros',ded:t.ded||'',nf:!!t.nf});
  });
  (data.fixed||[]).forEach((f,i)=>{
    const value=num(f.value);
    if(!f.desc||!(value>0)||!/^\d{4}-\d{2}$/.test(f.start||'')) return errs.push(`fixo ${i+1} (${f.desc||'?'})`);
    out.fixed.push({id:f.id||uid(),type:f.type==='in'?'in':'out',desc:f.desc,value,cat:f.cat||'Outros',start:f.start,day:f.day?+f.day:null,end:f.end||null,ded:f.ded||'',nf:!!f.nf});
  });
  if(data.irDates && typeof data.irDates==='object') out.irDates = data.irDates;
  if(data.balance && /^\d{4}-\d{2}-\d{2}$/.test(data.balance.date||'') && isFinite(+data.balance.value)) out.balance = {value:+data.balance.value,date:data.balance.date};
  if(data.budget>0) out.budget = num(data.budget);
  if(data.rates && typeof data.rates==='object') out.rates = data.rates;
  if(data.imovel && parseMoney(data.imovel.parcelaRef)>0) out.imovel = {...IMOVEL_DEFAULT,...data.imovel};
  if(Array.isArray(data.ferias)) out.ferias = data.ferias.filter(f=>/^\d{4}-\d{2}-\d{2}$/.test(f.start||'')&&f.dias>0).map(f=>({id:f.id||uid(),start:f.start,dias:+f.dias,abono:+f.abono||0}));
  if(data.salary && parseMoney(data.salary.gross)>0){
    const s = data.salary;
    out.salary = {gross:num(s.gross), advPct:s.advPct!=null?Number(s.advPct):40, deps:parseInt(s.deps)||0,
      vtValue:num(s.vtValue||0), vr:num(s.vr||0), others:(s.others||[]).map(o=>({desc:o.desc,value:num(o.value)})),
      since:s.since||THIS_MONTH, decimo:s.decimo!==false, actual:s.actual||{}};
  }
  return {out,errs};
}
function merge(data,replace){
  const {out,errs} = normalize(data);
  const n = out.tx.length+out.fixed.length+out.debts.length+(out.salary?1:0);
  if(out.salary) db.salary = out.salary;
  if(out.irDates) db.irDates = {...(db.irDates||{}),...out.irDates};
  if(out.balance) db.balance = out.balance;
  if(out.budget) db.budget = out.budget;
  if(out.rates) db.rates = {...(db.rates||{}),...out.rates};
  if(out.imovel) db.imovel = out.imovel;
  if(out.ferias) db.ferias = out.ferias;
  if(!n) return alert('Nada válido para importar.'+(errs.length?'\nIgnorados: '+errs.join(', '):''));
  if(replace) db = out;
  else ['tx','fixed','debts'].forEach(k=>out[k].forEach(it=>{const i=db[k].findIndex(x=>x.id===it.id);i>=0?db[k][i]=it:db[k].push(it)}));
  save();
  alert(`Importados ${n} itens: ${out.salary?'salário, ':''}${out.debts.length} dívidas, ${out.fixed.length} fixos, ${out.tx.length} lançamentos.`+(errs.length?'\n\nIgnorados (dados incompletos): '+errs.join(', '):''));
}
function parseJSON(text){
  text = text.trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  try{return JSON.parse(text)}catch(e){alert('Não consegui ler esses dados. Confira se colou o bloco inteiro.');return null}
}
function importPaste(){const d=parseJSON($('#paste').value);if(d){merge(d,false);$('#paste').value=''}}
function importFile(inp){
  const f=inp.files[0]; if(!f) return;
  f.text().then(t=>{const d=parseJSON(t); if(d && confirm('Substituir todos os dados atuais pelo backup?\n(Cancelar = juntar com os dados atuais)')) merge(d,true); else if(d) merge(d,false); inp.value=''});
}
async function exportData(){
  const json = JSON.stringify({app:'financas',version:1,exportedAt:new Date().toISOString(),...db},null,2);
  const name = `financas-backup-${TODAY}.json`;
  const file = new File([json],name,{type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function copyData(){
  try{await navigator.clipboard.writeText(JSON.stringify(db));alert('Dados copiados. Cole na conversa com o Claude.')}
  catch(e){alert('Não foi possível copiar automaticamente. Use Exportar backup.')}
}
function wipe(){if(confirm('Apagar TODOS os dados deste aparelho? Isso não pode ser desfeito.')&&confirm('Tem certeza? Faça um backup antes se quiser guardar.')){db=blank();save()}}

/* ---------- navegação ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;window.scrollTo(0,0);render()});
$('#prev').onclick=()=>{st.month=addM(st.month,-1);render()};
$('#next').onclick=()=>{st.month=addM(st.month,1);render()};
$('#gotoday').onclick=()=>{st.month=THIS_MONTH;render()};
$('#fab').onclick=()=>st.view==='dividas'?openDebt():openTx();
render();

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
