function openFreioCfg(){
  const c = FR().cfg, sug = sugestaoHora();
  openSheet(`<h3>⚙️ Ajustes do Freio <button onclick="closeSheet()">Fechar</button></h3>
    <label class="f"><span>Quanto vale 1 hora do seu trabalho (R$, líquido)</span><input id="cfHora" inputmode="decimal" value="${c.hora?String(c.hora).replace('.',','):''}" placeholder="${sug?String(sug).replace('.',','):'0,00'}"></label>
    ${sug?`<div class="hint">Pelo seu salário líquido (÷ 220 horas no mês): ~${brl(sug)}/h. <a href="#" onclick="document.getElementById('cfHora').value='${String(sug).replace('.',',')}';return false">Usar esse valor</a></div>`:''}
    <label class="f"><span>Tempo do cadeado no Cofre</span><select id="cfHoras">${COFRE_OPCOES.map(([h,l])=>`<option value="${h}" ${c.horas===h?'selected':''}>${l}</option>`).join('')}</select></label>
    <h4 class="mini">💬 Pessoa de apoio (opcional)</h4>
    <div class="row"><label class="f"><span>Nome</span><input id="cfNome" value="${esc(c.apoio?.nome||'')}"></label>
      <label class="f"><span>WhatsApp (com DDD)</span><input id="cfTel" inputmode="tel" value="${esc(c.apoio?.tel||'')}" placeholder="11 91234-5678"></label></div>
    <button class="btn" onclick="saveFreioCfg()">Salvar</button>`);
}
function saveFreioCfg(){
  const c = FR().cfg;
  c.hora = r2(parseMoney($('#cfHora').value)||0) || null;
  c.horas = +$('#cfHoras').value;
  const nome = $('#cfNome').value.trim(), tel = $('#cfTel').value.trim();
  c.apoio = tel ? {nome,tel} : null;
  closeSheet(); save();
}
function checkin(k){
  const f = FR(); if(f.checkins.some(c=>c.date===TODAY)) return;
  f.checkins.push({date:TODAY, emo:k}); save();
}

/* ---------- tela do Freio ---------- */
VIEWS.freio = function(){
  const f = FR(), s = freioStats(), now = Date.now();
  st.freioTab = st.freioTab || 'cofre';
  const ab = abertos(), cofre = f.desejos.filter(d=>d.status==='cofre').sort((a,b)=>a.liberaEm.localeCompare(b.liberaEm));
  const fezCheckin = f.checkins.some(c=>c.date===TODAY);
  const cofreView = `
    ${ab.map(d=>`<div class="alert" style="background:var(--mint)" onclick="openDecidir('${d.id}')"><span class="ico">🔓</span><div><b>O cadeado abriu. Ainda quer isso?</b><span>${esc(d.item)}${d.preco?' · '+brl(d.preco):''}</span></div></div>`).join('')}
    <div class="card"><h2>🔒 Cofre de desejos</h2>
      ${cofre.length?`<ul class="list">${cofre.map(d=>{const left=new Date(d.liberaEm)-now;return `<li class="tap" onclick="${left<=0?`openDecidir('${d.id}')`:`openPosCofre('${d.id}')`}">
        <span class="dot">${left<=0?'🔓':'🔒'}</span><div class="main"><div class="t">${esc(d.item)}</div>
        <div class="m">${d.loja?esc(d.loja)+' · ':''}${d.emocoes.map(emoIcon).join('')} ${left<=0?'<b class="pos">pronto para decidir</b>':'abre em '+fmtLeft(left)}</div></div>
        <div class="amt">${d.preco?brl(d.preco):''}<small>${d.preco?horasTxt(d.preco):''}</small></div></li>`}).join('')}</ul>`
        :'<div class="empty">Seu Cofre está vazio. Quando bater a vontade, guarde aqui primeiro. 🔒</div>'}
      ${!f.cfg.hora?`<p class="hint">Dica: em ⚙️ Ajustes, informe o valor da sua hora para ver quanto trabalho cada item custa.</p>`:''}
    </div>
    ${f.desejos.some(d=>d.status!=='cofre')?`<div class="card"><details><summary>Decisões anteriores (${f.desejos.filter(d=>d.status!=='cofre').length})</summary>
      <ul class="list">${f.desejos.filter(d=>d.status!=='cofre').slice().reverse().map(d=>`<li><span class="dot">${d.status==='desisti'?'💚':'🛍️'}</span><div class="main"><div class="t">${esc(d.item)}</div><div class="m">${d.status==='desisti'?'desisti':'comprei conscientemente'} · ${dLabel(d.resolvido.slice(0,10))}</div></div><div class="amt">${d.preco?brl(d.preco):''}</div></li>`).join('')}</ul></details></div>`:''}`;
  const body = {cofre:cofreView, jardim:jardimView(), gatilhos:gatilhosView(), planos:planosView(), missoes:missoesView()}[st.freioTab];
  return `
  <div class="card hero"><span class="emoji" onclick="openFreioCfg()" style="cursor:pointer">⚙️</span>
    <div class="label">Freio</div>
    <div class="count"><span class="big">${s.vitorias}</span><span>vitória${s.vitorias===1?'':'s'}</span></div>
    <div class="xp"><span>Nível ${s.nivel}</span><div class="prog"><i style="width:${s.noNivel}%"></i></div><span>${s.noNivel}/100 XP</span></div>
  </div>
  <button class="bigbtn" onclick="openVontade()">🛑 Tô com vontade de comprar</button>
  <div class="actions three">
    <button class="action" onclick="openSurf()"><span class="ai">🌊</span><span><b>Surfar a onda</b></span></button>
    <button class="action" onclick="pedirApoio()"><span class="ai">💬</span><span><b>Pedir apoio</b></span></button>
    <button class="action" onclick="openImpulso()"><span class="ai">🛍️</span><span><b>Comprei por impulso</b></span></button>
  </div>
  ${!fezCheckin?`<div class="card"><h2>☀️ Check-in de hoje</h2><p class="sub">Como você está agora? (+5 XP)</p>
    <div class="chips"><button class="chip" onclick="checkin('bem')">😊 bem</button>${EMO.filter(e=>e[0]!=='outro').map(([k,i,l])=>`<button class="chip" onclick="checkin('${k}')">${i} ${l}</button>`).join('')}</div></div>`:''}
  <div class="seg scroll">${[['cofre','🔒 Cofre'],['jardim','🌱 Jardim'],['gatilhos','🗺️ Gatilhos'],['planos','🃏 Planos'],['missoes','🧹 Missões']].map(([v,l])=>`<button class="${st.freioTab===v?'on':''}" onclick="st.freioTab='${v}';render()">${l}</button>`).join('')}</div>
  ${body}
  <p class="foot">Se a compra compulsiva está afetando muito sua vida, procure apoio profissional (ex.: TCC, PRO-AMITI/IPq-USP).</p>`;
};
function freioBanner(){
  const n = db.freio ? abertos().length : 0;
  return `<button class="bigbtn small" onclick="openVontade()">🛑 Tô com vontade de comprar</button>
    ${n?`<div class="alert" style="background:var(--mint)" onclick="st.view='freio';st.freioTab='cofre';render()"><span class="ico">🔓</span><div><b>O cadeado abriu${n>1?` para ${n} itens`:''}</b><span>Ainda quer? Toque para decidir com calma.</span></div></div>`:''}`;
}

  ['🏠','Início','Mostra as próximas datas: quando cai o salário e quanto você precisa ter em cada <b>dia 5</b> e <b>dia 20</b>.<br><br>Verde = vai sobrar. Rosa = vai faltar.'],
  ['➕','Lançar','Aqui entra <b>o que é real</b>: o salário que caiu, um gasto, uma fatura nova, uma conta que você pagou.<br><br>O que não foi lançado aparece como <b>previsto</b>, sempre calculado para menos nos ganhos e para mais nas dívidas.'],
  ['🛑','Freio','Bateu vontade de comprar? Toque em <b>“Tô com vontade de comprar”</b>. O item vai para o Cofre com um cadeado, e você decide com calma depois.<br><br>Sem culpa, sem punição: cada passo conta como vitória. 💗'],
  ['🧪','Simular','Teste sem medo: e se eu parcelar essa fatura? E se eu tirar férias em dezembro?<br><br><b>Nada do que você testa muda seus dados reais.</b>'],
  ['🚀','Vamos começar?','Se o Claude preparou seus dados, cole tudo de uma vez. Se não, comece do zero pela aba Lançar.<br><br>O manual completo fica em <b>Mais → 📖 Ajuda</b>.'],
];
let introStep = 0;
function showIntro(step=0){
  introStep = step;
  const [ico,t,txt] = INTRO[step], last = step===INTRO.length-1;
  $('#sheetbg').classList.add('open','intro');
  $('#sheet').innerHTML = `<div class="introbox">
    <div class="introico">${ico}</div><h2>${t}</h2><p>${txt}</p>
    <div class="dots">${INTRO.map((_,i)=>`<i class="${i===step?'on':''}"></i>`).join('')}</div>
    ${last?`<button class="btn" onclick="endIntro('dados')">Colar meus dados</button>
      <button class="btn sec" onclick="endIntro('lancar')">Começar do zero</button>`
      :`<button class="btn" onclick="showIntro(${step+1})">Próximo</button>
      <button class="btn sec" style="background:none" onclick="endIntro()">Pular introdução</button>`}
    ${step>0&&!last?`<button class="back" onclick="showIntro(${step-1})">‹ voltar</button>`:''}
  </div>`;
}
function endIntro(go){
  localStorage.setItem(INTRO_KEY,'1');
  $('#sheetbg').classList.remove('open','intro');
  if(go==='dados'){ st.view='mais'; st.maisTab='dados'; }
  if(go==='lancar'){ st.view='lancar'; }
  window.scrollTo(0,0); render();
}

function manualView(){

    <button class="btn sec" onclick="showIntro(0)">Ver a introdução de novo</button></div>`;
}

/* ---------- navegação ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;window.scrollTo(0,0);render()});
$('#prev').onclick=()=>{st.month=addM(st.month,-1);render()};
$('#next').onclick=()=>{st.month=addM(st.month,1);render()};
$('#gotoday').onclick=()=>{st.month=THIS_MONTH;render()};

render();

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
